# A missile in flight.

# From the storeroom (a short bow and flaming arrows) to the patrol gallery's door, a flaming arrow
# shot into its dark middle: halfway (frozen time), lighting its way. The flaming arrows are picked
# up first, so they go into the empty quiver by themselves; the plain arrows picked up after stay
# in the pack (the `wait` keeps the turns and the clock as they were with a hand-quivered stack).
[[golden]]
name = "ranged-flight"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:S move:W pickup move:E pickup equip:missile_weapon:c wait move:NE move:E move:N*4 move:E*20 open:S move:S fire:45,17"
