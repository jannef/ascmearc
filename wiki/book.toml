[book]
title = "Ascmearc Wiki"
description = "How Ascmearc works: time, light, sight, the overworld, and more."
authors = ["Janne Lê Forsell"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
# The wiki is published beside the game at https://ascmearc.com/wiki/.
site-url = "/wiki/"
git-repository-url = "https://github.com/jannef/ascmearc"
edit-url-template = "https://github.com/jannef/ascmearc/edit/main/wiki/{path}"

# Fold the sidebar: only the open page's branch shows its children.
[output.html.fold]
enable = true
level = 1
