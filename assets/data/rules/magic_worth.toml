# What magic adds to an item's worth (#1709; crates/ascmearc-core/src/content/
# magic_worth.rs, read by `Stack::worth` in object.rs). A shop's prices (asking and paying) and
# the craftsperson's patron read the worth: the item as it is made (its parts, an anvil's grade),
# then its magic, then a maker's mark's half again on top of it all.
#
# Only what the player knows is priced (the keeper knows no more): the rarity always (it shows
# at once), the affixes once the item is identified. A shop's bill keeps an item as it was when
# it was taken (docs/dev/shops.md). A curse the player knows of (#1754) makes the magic worth
# nothing: a cursed item sells for what it is made of alone.
#
# Fields:
#   rarity   percent added to the item's worth as made: `magic`, `rare` (a unique is rare)
#   affix    gold added for each identified affix: `each`, plus `per_level` times the item level
#            its tier is found from (data/affixes/: a tier of level 12 adds 50 + 10 × 12 = 170,
#            one of level 40 adds 450). A unique's affixes are priced by the unique's own item
#            level instead (data/uniques/ `level`), so their values, set by hand, never move its
#            price
#
# Tuned so that magic clearly pays: a dagger (worth 30) is worth 45 as a magic item unidentified
# and 45 + 60 = 105 identified with Sharp's first tier (level 1), three and a half times its base;
# a rare long sword (worth 80) with four affixes of level 8 tiers is worth 160 + 4 × 130 = 680.
# The gold grows slowly with the tier's level so that a rare of item level 40 stays a purchase a
# level-40 character can imagine (docs/design/item-level-40.md §9).

rarity = { magic = 50, rare = 100 }
affix = { each = 50, per_level = 10 }
