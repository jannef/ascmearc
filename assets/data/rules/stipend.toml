# The aristocrat's stipend (Stipend; #1405; crates/ascmearc-core/src/
# content/stipend.rs, world/classes/stipend.rs). A character with the Stipend class ability (the
# aristocrat's, from level 1) has their family put something by for them at every level they
# reach, a prestige class's levels too; it waits with their servant (a campaign's town's
# `servant`, data/towns/) until they speak to them.
#
# Fields:
#   purse  what every level reached puts by apart from its loot roll, in the one shape of
#          ../purses.toml: its coins (150 + 10d10, about 200 a level, the owner's "plentiful")
#          and, 4 times in 100, a loose gem at the level as item level, kept
#   loot   by `chance` percent, one loot roll per level reached, at the level as item level, through the loot code
#          (docs/dev/magic-items.md): finder is the roll's and the purse's own finder
#          (magic/finder.rs: `rarity` the percent more likely the magic and rare rarities are,
#          100: twice as likely; `quantity`, `unique`, `coins`, and `gems` as a talent's; the
#          player's own finder never counts here); what comes up is kept when it is magic or rare, or of one of the `keep` item
#          classes (../item_classes.toml), and otherwise thrown away. Tuned so that 30 to 50 %
#          of level-ups add an item (the owner; world/classes/stipend_tests.rs checks the band). The
#          Landed noble talent (../talents/landed_noble.toml) raises the gold (the finder's
#          `coins`) and the magic odds

purse = { coins = { dice = "10d10+150" }, gems = { chance = 4 } }
loot = { chance = 85, finder = { rarity = 100 }, keep = ["potions", "scrolls", "gems"] }
