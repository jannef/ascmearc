# Swimming in deep water (Swim; `world/levels/swim.rs`, `content/swim.rs`).
#
# Anyone may dive in, but not Strained or worse. Every turn spent in deep water is a check, and so
# is every step that starts there: 2d12 + Toughness's modifier + the talents' Toughness checks +
# what Swim gives, against `difficulty`, + `untrained` for one not trained in Swim, + `per_burden`
# for each level of burden above Unburdened, + 1 for every `worn` grams of gear worn and wielded.
# Made: the step, or the turn goes on. Failed: a step makes no headway, and the water takes `harm`
# percent of maximum hit points: `least` for a miss by 1, `per_miss` more for each point more, at
# most `most`. Not resisted, and it can kill (drowned). Water walking asks no check; a creature
# that `swims` always makes it.
#
# Paper (scrolls, grimoires, letters, books: what is made mostly of paper; never a quest's
# object) may be ruined: each turn in the water, each carried stack loses one item by
# `paper.made` percent after a made check, `paper.failed` percent after a failed one.

difficulty = 11
untrained = 3
per_burden = 6
worn = 2000
harm = { least = 10, most = 34, per_miss = 2 }
paper = { made = 2, failed = 20 }
