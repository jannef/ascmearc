# Web (the first spell list): sticky strands burst where it is aimed and stay there, the same
# webs as a spider's (data/rules/webs.toml, `world/levels/web.rs`): everyone they reach, the
# caster too, may be caught at once, and whoever walks in later may be; fire burns them away.
# Its growth is its reach and its spread: more cells, a wider burst.
[[spell]]
id = "web"
name = "Web"
description = "Sticky strands burst where you aim them and stay, clinging to the ground: whoever stands in them or walks into them may be caught fast. Fire burns them away."
level = 7
school = "transmutation"
kind = "hex"
shape = "burst"
resolution = "area"
range = 8
radius = 1
effect = { web = true }

[spell.cast]
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
range = "willpower 14 9, 18 10"
radius = "presence 18 2"

[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 10 }
4 = { time_off = 15 }
5 = { cells = 1 }
6 = { mana_off = 10 }
7 = { time_off = 15 }
8 = { cells = 1 }
9 = { mana_off = 10 }
10 = { radius = 1 }
