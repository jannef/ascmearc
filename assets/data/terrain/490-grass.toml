# Under the open sky: outdoor levels are lit by the sun and the sky by day.
# Tall terrain casts shadows that turn and stretch with the sun (`height`); roofed floor never
# gets sun or sky light.

[[terrain]]
id = "grass"
plants = true
name = "grass"
glyph = "."
fg = "#86ba5c"
bg = "#22401a"
bounce = "#b4dc8c"
# Soft underfoot.
step_noise = 70

[terrain.burn]
burns = 24
spreads = 12
leaves = "scorched_earth"
burning = "burning_grass"
