# A tree on fire (`world/levels/fire.rs`, docs/dev/fire.md): what a tree, a pine, or a dead tree
# is while it burns (their `burn` tables). Its crown is flame and smoke: seen through, as every
# light-giving terrain is. Never laid by a generator.
[[terrain]]
id = "burning_tree"
name = "burning tree"
description = "Fire climbs the trunk and roars in the branches."
glyph = "♣"
fg = "#ffb050"
bg = "#2a0c04"
walkable = false
height = 2
light = "burning_wood"
glow = 0.5
haze = 0.8
stains = false
flames = "blaze"

