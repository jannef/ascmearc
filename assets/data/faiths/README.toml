# Faiths: what a character professes, one file per faith holding one `[[faith]]`. A new
# character chooses one at creation among their race's (races.toml: `faith`, the default, and
# `faiths`, the others open), after the class; a class's `faith` narrows the list by face
# (classes/README.toml). The design is docs/design/prayer.md (§3, §10.1), the lore
# docs/design/religions.md. This file holds only the notes below: a file of comments defines
# nothing.
#
# The faiths are listed at creation in path order, so the files are named `NNN-id.toml`
# (`010-mynster.toml`). Saves name a faith by its index: a new faith takes a free number where it
# belongs.
#
# Fields:
#   id, name      the faith's id (for the command line and saves) and how the game names it, a
#                 proper name with its own article ("the Mynster")
#   description   one line, shown when choosing
#   face          who answers its prayers: "holy" (the Light, every church of it), "dark" (the
#                 Dark and the powers under the hills), or "none" (nothing answers as a god
#                 does); a faith with no face says how it does not answer, with `answers` or
#                 `listens`
#   shared        the faiths whose faithful its altars and shrines hear as their own, by id
#                 (default none; each Light church lists the other four)
#   stranger      what its altars do with another faith's prayer: "cold" (unheard, the
#                 default), "hears" (heard, in its own face), or "bane" (the god wants you gone)
#   answers       false: it never answers a prayer (the Frogs Beyond; default true)
#   listens       "anywhere" (the default) or "altar": heard only beside an altar, as that
#                 altar's stranger (the Big Ones)
#
# [faith.words]   its own words for its prayers, each optional (the face's in prayer.toml's
#                 `[words]` otherwise): `pray` (a prayer begun and answered), `fizzle`, `nothing`
#                 (nothing to pray for), `unheard` (its god does not hear the player), and
#                 `silent`, a lower-case clause the abilities menu greys Pray with, for a faith
#                 that answers nothing or listens only at an altar ("the Frogs do not answer")
# [faith.use]     its own line for a use answered, by use id (`wounds = "..."`), each optional
# [faith.piety]   what its god thinks of the player (../piety.toml, docs/dev/piety.md), each
#                 optional: `deeds` (deed id = worth) added to its side's base table (a holy face
#                 is the goodly side, a dark face the wicked; no face, no base), the same key
#                 replacing the base's worth and 0 cancelling it; `kills` (`tags`: tag = worth,
#                 `while`: status id = worth for a hostile kill under it), merged the same way;
#                 `wane` (`{ favour, anger }`, each at least 1) in place of piety.toml's. A faith
#                 with no face and no table notices nothing (the Frogs Beyond, the Big Ones)
# [faith.piety.words]  its own line for each standing (`favoured`, `heard`, `unheard`,
#                 `shunned`), each optional: said when the standing is reached, and on Pray in
#                 the abilities menu while it is not `heard`; piety.toml's band lines otherwise
#
# Creation reads the face; prayer reads `answers`, `listens`, and the words; the altars read the
# rest as they are built (prayer.md §11).
