# The Never-Full: Hunger, the ratfolk's, the Profane (religions.md §5.3).
[[faith]]
id = "never_full"
name = "the Never-Full"
description = "Hunger, the ratfolk's Ould Mother: the old hungry thing under everything, whom the Mynster calls the Profane."
face = "dark"
stranger = "bane"

[faith.words]
pray = "You gnaw at nothing, and pray to the Ould Mother."
unheard = "You gnaw, and the Ould Mother is not hungry for you."

# Hunger's sacrament: the thinking eaten, the craving's rows crossed, the profane meal. She is
# never full, so her favour goes fast; she is slow to forget.
[faith.piety]
deeds = { eat_sapient = 3, eat_kin = 5, eat_profane = 25, craving_threshold = 12, craving_gift = 12, consecrate = -10 }
wane = { favour = 4, anger = 1 }

[faith.piety.words]
favoured = "The Ould Mother is fond of you."
heard = "The Ould Mother hears you."
unheard = "The Ould Mother has forgotten you."
shunned = "The Ould Mother has turned her back on you."
