# The Glimmering: the gnomes' Light (religions.md §3.5).
[[faith]]
id = "glimmering"
name = "the Glimmering"
description = "The gnomes' Light, kept in the stone: making, curiosity, and the hurt. It turns no one away."
face = "holy"
shared = ["mynster", "hearth", "spark", "elder_light"]
