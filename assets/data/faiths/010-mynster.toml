# The Mynster: the humans' church of the Light (docs/design/religions.md §3.2).
[[faith]]
id = "mynster"
name = "the Mynster"
description = "The humans' church of the Light: mercy, burial, and the sick, and penance before healing."
face = "holy"
shared = ["hearth", "spark", "glimmering", "elder_light"]
stranger = "cold"

[faith.words]
unheard = "You pray, but the Light does not know you."

# Its own deeds over the goodly base (../piety.toml): it prizes the rite of consecration most.
[faith.piety]
deeds = { consecrate = 10 }

[faith.piety.words]
favoured = "The Light is with you."
heard = "The Light hears you."
unheard = "The Light is far from you."
shunned = "The Light has turned from you."
