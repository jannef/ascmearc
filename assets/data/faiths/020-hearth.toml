# The Hearth: the halflings' Light (religions.md §3.3).
[[faith]]
id = "hearth"
name = "the Hearth"
description = "The halflings' Light, the fire in the middle of the house: the table, the guest, and the dead remembered at supper."
face = "holy"
glow = "altar_hearth"
altar_description = "It is the Hearth's: a kettle hangs over a small fire beside it."
stranger = "hears"

[faith.words]
pray = "You say the words over the table."
unheard = "You say the words, but the hearth is cold to you."
