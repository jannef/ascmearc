# The Hearth: the halflings' Light (religions.md §3.3).
[[faith]]
id = "hearth"
name = "the Hearth"
description = "The halflings' Light, the fire in the middle of the house: the table, the guest, and the dead remembered at supper."
face = "holy"
shared = ["mynster", "spark", "glimmering", "elder_light"]
stranger = "hears"

[faith.words]
pray = "You say the words over the table."
unheard = "You say the words, but the hearth is cold to you."

# Eating well, the guest, and nothing taken that is not offered.
[faith.piety]
deeds = { ate_meal = 1, make_peace = 8, theft = -10, kill_peaceful = -15 }

[faith.piety.words]
favoured = "The hearth burns warm for you."
heard = "The hearth knows you."
unheard = "The hearth has gone cold to you."
shunned = "The hearth's door is shut to you."
