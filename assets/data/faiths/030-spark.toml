# The Spark: the dwarves' Light (religions.md §3.4).
[[faith]]
id = "spark"
name = "the Spark"
description = "The dwarves' Light, struck from stone in the dark: work, oath, and memory. Every forge is its altar."
face = "holy"
shared = ["mynster", "hearth", "glimmering", "elder_light"]
stranger = "cold"

[faith.words]
pray = "You strike the stone once, as on the anvil, and wait."
unheard = "You strike the stone, and no spark answers."
