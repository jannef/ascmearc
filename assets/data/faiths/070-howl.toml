# The Howl: Wrath, the orcs' (religions.md §5.1).
[[faith]]
id = "howl"
name = "the Howl"
description = "The orcs' Wrath, the fury that fills a body and spends it: strength, fearlessness, and a quick death unregretted."
face = "dark"
stranger = "bane"

[faith.words]
pray = "You howl, and something howls back."
unheard = "You howl, and nothing howls back."

# The fury that fills a body and spends it: kills while Raging, and no patience. What it thinks
# of you this week is gone by the next.
[faith.piety]
deeds = { make_peace = -10 }
kills = { while = { raging = 1 } }
wane = { favour = 20, anger = 20 }

[faith.piety.words]
favoured = "The Howl roars in your blood."
heard = "The Howl hears you."
unheard = "The Howl is quiet in you."
shunned = "The Howl has gone out of you."
