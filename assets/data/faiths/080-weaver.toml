# The Weaver: Envy, the drow's (religions.md §5.2).
[[faith]]
id = "weaver"
name = "the Weaver"
description = "The drow's goddess of Envy, who gave them the wanting: every drow climbs her web toward what another has."
face = "dark"
stranger = "bane"

[faith.words]
pray = "You speketh to the Webbestre, and she herkneth."
unheard = "You speketh to the Webbestre, and she herkneth nat."

# Envy: taking what another had, and the fiends; peace, holy work, and her spiders' deaths offend
# her. Her favour is climbed by others; she is slow to forget.
[faith.piety]
deeds = { theft = 4, summon_fiend = 10, pay_debt = -3, make_peace = -10, consecrate = -10 }
kills = { tags = { spider = -5 } }
wane = { favour = 4, anger = 1 }

[faith.piety.words]
favoured = "The Webbestre smyleth on thee."
heard = "The Webbestre herkneth thee."
unheard = "The Webbestre herkneth thee nat."
shunned = "The Webbestre hath cut thee from hir web."
