# Spell glow (docs/dev/rendering.md "Spell glow"): the school of every buff's and hex's status, and
# each school's colour. The renderer makes the glyph of every actor the player sees with a glowing
# status glow and glint in its first effect's school's colour: the one sign on the map that a
# creature is buffed or hexed. Presentation only: no rule reads it (a buff is a buff spell's
# status whether it glows or not), so it is not in the content fingerprint.
#
# [[school]]   one row per school of magic (data/spells: `school`)
#   id         the school
#   color      its colour, "#rrggbb", through the palette as every content colour is
#
# [[status]]   one row per glowing status: a `kind = "buff"` or `"hex"` spell's status (one without
#              a row does not glow; a sleep's, `sleeps`, never does: Slumber's `asleep`, a den's),
#              or a status no spell lays that names its own `kind` (a lure quest's binding)
#   status     an id in data/status/; it must have `seen` (others see it on a creature)
#   school     the school whose colour it glows in
#   kind       "buff" or "hex", only for a status no spell lays (a spell's status takes its
#              spell's)
#
# Rows are in no particular order: a glow takes its colour from the first in status order
# (data/status/), a buff's before a hex's.

[[school]]
id = "evocation"
color = "#e0803c"

[[school]]
id = "necromancy"
color = "#a48cc8"

[[school]]
id = "abjuration"
color = "#80b4e0"

[[school]]
id = "restoration"
color = "#e0c060"

[[school]]
id = "transmutation"
color = "#78c478"

[[school]]
id = "enchantment"
color = "#d07ab0"

[[school]]
id = "divination"
color = "#d8d8e8"

[[school]]
id = "illusion"
color = "#9a88e8"

# Buffs.

# Light.
[[status]]
status = "lit"
school = "evocation"

# Sense the quick.
[[status]]
status = "quick_sensed"
school = "divination"

# See invisible.
[[status]]
status = "seeing"
school = "divination"

# Haste.
[[status]]
status = "hasted"
school = "transmutation"

# Barkskin.
[[status]]
status = "barkskin"
school = "transmutation"

# Blessing.
[[status]]
status = "blessed"
school = "abjuration"

# A lure quest's binding (the crystal guardian's, Gimmwīc's): no spell lays it, so it names its
# kind.
[[status]]
status = "bound"
school = "enchantment"
kind = "buff"

# Fire cloak.
[[status]]
status = "fire_cloaked"
school = "abjuration"

# Brand.
[[status]]
status = "branded_blade"
school = "transmutation"

# Water walking.
[[status]]
status = "water_borne"
school = "transmutation"

# Nightsight.
[[status]]
status = "cat_eyed"
school = "transmutation"

# Glamour.
[[status]]
status = "glamoured"
school = "illusion"

# Renewal.
[[status]]
status = "renewing"
school = "restoration"

# Hexes.

# Evil eye.
[[status]]
status = "ill_wished"
school = "enchantment"

# Hex of weakness.
[[status]]
status = "weakened"
school = "necromancy"

# Curse of sloth.
[[status]]
status = "sluggish"
school = "transmutation"

# Sleep.
[[status]]
status = "drowsy"
school = "enchantment"

# Webbed does not glow: webs are strands on the ground (data/rules/webs.toml), a spider's or the
# Web spell's alike, and Bramble's thorns hold as they do.

# Bind.
[[status]]
status = "pinned"
school = "enchantment"

# Fear.
[[status]]
status = "frightened"
school = "enchantment"

# Flare.
[[status]]
status = "stunned"
school = "evocation"

# Silence.
[[status]]
status = "silenced"
school = "abjuration"

# Mesmerise.
[[status]]
status = "transfixed"
school = "enchantment"
