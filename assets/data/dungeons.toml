# Dungeon branches: stacks of procedurally generated levels. This file is the field
# reference: the branches are a campaign's, in its data/dungeons/ (the showcase's Depths:
# campaigns/showcase/data/dungeons/showcase.toml), but for the shared portal branch,
# data/dungeons/hellegeat.toml. Stairs lead into a branch
# with `to = "<id>:<depth>"` (e.g. `to = "depths:1"`), and a scenario may start in one. Each level
# is generated on its first visit from the run seed and its id, then persists like a hand-made
# level. Its `<` leads one level up (on depth 1: back where the player came from), its `>` one
# level down (the deepest level has none).
#
# A `[[dungeon]]` table holds the branch: its id and name, how deep it goes and where it leads.
# Its `[dungeon.level]` table is the level template: how every level is made, from its generator
# and size to who lives there. `[[dungeon.levels]]` rows (`from`, `to`) take the same fields,
# each optional, layered field by field over the template for their depths (first match wins),
# so any level field may vary by depth; a table field (`generator` of the template's kind,
# `chests`, `spawn`, `room_effects`, `shops`) layers field by field too, `danger` is one value.
# What is checked is each depth's resolved plan: a depth without a
# `danger`, a size its generator does not build, a `hidden` on more than one depth, or a tower
# plan with what a tower has not is refused wherever the field came from (#1834;
# `content/dungeon.rs`, docs/dev/mapgen.md "Branches and level plans").
#
# Branch fields ([[dungeon]]):
#   id         branch id; its levels are "<id>:1" to "<id>:<depth>"
#   name       level names are "<name> <depth>", a branch of one floor's just "<name>" (default:
#              the id)
#   arrival    a line said each time the player arrives on the first level by stairs (optional)
#   depth      number of levels
#   kind       "dungeon" (the default) or "tower": floors that go up from a hand-made clearing,
#              with `floors`, `clearing`, and `top` instead of `depth` (below)
#   below      a level of another bounded branch of the same campaign (`below = "fyrdelf:12"`):
#              the branch is a way up; its deepest level's `>` leads there,
#              that level gets a `<` back up near a vault it names, and its first level's `<`
#              climbs out to its way in, however it was entered (default none)
#   bottom     a hand-made level of the same campaign (`bottom = "gimmwic"`) its deepest level's
#              `>` leads to; that level's own `<` must name the deepest level (`to =
#              "deopgang:11"`), and the player arrives on it (default none; not with `below`,
#              `endless`, or `portal`). A hidden location's stairs up count: the Skeul Hir's
#              bottom, Gimmwīc, has its `<` back hidden until a quest opens it
#   above      a level of another bounded branch of the same campaign (`above = "lytelscraef:2"`)
#              its first level's `<` leads to, however the branch was entered; that level's
#              `[[dungeon.levels]]` row keeps a hidden way down into the first level (`hidden`,
#              below), so the player arrives on it (default none; not with `endless` or `portal`)
#   [dungeon.endless]  instead of `depth`: floors without end, each made as it is reached and
#              forgotten when left: `caves` (percent of floors made by `caves_level`), `caves_level`
#              (the level fields a caves floor changes, over the template: e.g. `{ generator = {
#              kind = "caves" }, size = [100, 40] }`), `dread` (`dread_one_in` by danger: `{ steps =
#              [[70, 40]], halves = 10, least = 5 }`), and `[[dungeon.endless.boss]]` rows (`depth`,
#              `creature`, `vault`: a layer boss and its lair). One plan at every depth: no
#              `[[dungeon.levels]]`, no `vaults`, no `hidden`
#   [dungeon.portal]  (an empty table, with `depth`; no `endless`, no `below`) a branch of Pits: it
#              exists only as instances opened by a portal, Pit S's
#              levels "<id>@S:1" to "<id>@S:<depth>", each made from the run seed and its id and
#              forgotten when left; no stairs, hidden location, or quest may name them. `boss =
#              { depth, creature, vault }`: every Pit's warden and its hall
#   kind = "tower"  a wizard's tower (docs/dev/mapgen.md "Towers"): its levels go up,
#              "<id>:1" the floor above the ground. With it, and only with it:
#     floors   the tower's floors, its ground floor and top included (at least 3): the
#              branch's levels are "<id>:1" to "<id>:<floors - 2>", named "<name> 2" up
#     clearing an outdoor level of the same campaign, the ground floor: the tower stands in it
#              as the box of its tower wall, its `<` inside leading to "<id>:1"; every floor is
#              its size, built on that box
#     top      a hand-made level of the same campaign and the clearing's size, the top floor:
#              the highest level's `<` leads there, and its own `>` must lead back from the
#              cell of that `<` (the load error says which)
#              Its template's generator is `{ kind = "tower" }` (a ring wall with windows round
#              rooms and halls); each level's `<` climbs to the next (the highest's to `top`),
#              its `>` goes down (the first's to the clearing's `<`); the traps, danger,
#              population, loot, and chests as any level's. Refused beside it: the branch
#              fields depth, below, bottom, endless, portal, and in the template or any row the
#              level fields size, secret_doors, key, ores (nothing is mined: a tower has none),
#              temperature, vaults, hidden, and a generator of any other kind
#
# Level fields ([dungeon.level], and each optional in a [[dungeon.levels]] row):
#   generator  a table with its `kind` and any of the kind's parameters, which override
#              data/generators.toml's for that level, just those (`generator = { kind = "caves",
#              rock = 50 }`); a row's generator of the template's kind layers over the template's
#              field by field, one of another kind starts from that kind's table. The kinds:
#              "rooms" (rooms and corridors, ADOM-like), "caves" (cellular automata), "tunnels"
#              (caverns of varied size joined by narrow winding tunnels, loops among them),
#              "passage" (one long hewn way from stairs to stairs, no second route: shortcuts;
#              its `random_vaults = [fewest, most]` stamps vaults with one entrance, default
#              none),
#              "minster" (a drowned church's cellars and crypts, flooding and falling deeper down
#              the branch, at least 90x36; docs/dev/mapgen.md "The minster"), "mines" (a worked
#              mine that opens up and grows lava from the branch's first mines floor to its last,
#              `mapgen/mines.rs`), or a tower's "tower". The mines' `openness` and `lava` and the
#              minster's `flood` and `ruin` are ramps over the branch's floors of that kind
#              (generators.toml); a row pins one with a number (`{ kind = "mines", lava = 0 }`)
#   size      [width, height]
#   creatures  creature ids generators may place on patrol (default none)
#   traps      trap ids (data/traps.toml) generators hide on each level, all hidden, never on or
#              next to stairs nor on a patrol; an id named twice comes up twice as often
#              (default none)
#   traps_per_level  [least, most] traps a level gets (default [2, 4])
#   secret_doors  [least, most] doors the rooms generator hides on a level (secret doors; default
#              none): only doors the stairs and every key are reached
#              without, so a level may get fewer
#   hidden_danger_percent  how much harder its hidden features (secret doors, hidden traps)
#              are to find, in percent of the floor's danger (rounded down; default 0)
#   locks_danger_percent  how much harder its locks are to pick, in percent of the floor's
#              danger (rounded down), on top of the lock's own difficulty (14 unless a vault
#              gives it one; default 0)
#   ores       the only ores (metal ids, each with an ore row in data/mining.toml) its walls give
#              a miner; `[]` none; stone and gems are found anyway (default:
#              every ore of the table)
#   loot       [fewest, most] items of loot on the floor of each level, rolled at the floor's
#              item level (its danger) (default none)
#   chests     `{ chance, count }`: percent of its floors with chests and how many such
#              a floor gets, `[least, most]`, each of the floor's level, locked,
#              trapped, and filled by its band in data/chests.toml (default
#              `{ chance = 20, count = [1, 1] }`: one floor in five has one)
#   ambient    [r, g, b, uv] light everywhere (default none)
#   temperature  °C on its levels (default 10, the dungeon
#              default): water there freezes below 0
#   key        a key (objects.toml): the rooms generator locks the door of up to
#              two rooms that have only one (the mines generator, of up to two chambers), with the lock this key opens, and leaves the key
#              where the player reaches it without unlocking anything (default none: no locks)
#   danger     how dangerous its floors are, and the item level of their loot: every floor
#              needs one (depth reaches loot only through it): `danger = 4` is `{ base = 4, per_depth = 1 }`, the floor at depth d
#              `base + (d - 1) × per_depth` (at most 99 a floor); `player = {
#              percent, from, max }` adds percent % of each player level past `from`, at most
#              `max` (an area that grows with the player). One value: a row's replaces the
#              template's whole. With a danger, also:
#   population  creature ids that live there (default `creatures`); each type's level is its
#              danger, and draws favour types at about the floor's
#   population_count  how many a floor holds: a number, or `{ per_1000, least, most }` by its
#              walkable cells (default { per_1000 = 35, least = 25, most = 80 })
#   stray      percent of draws made from the generic creature list instead of `population`
#              (default `[defaults]`'s): every type of this campaign or of none that
#              is hostile to the player, no unique, no animated object, and not marked
#              `stray = false`, whether a population names it or not, and every type that lives
#              in some branch or level with a danger of this campaign or of none, uniques left
#              out (people, shopkeepers, and guardians are not hostile or are unique, so they
#              never stray); 0: only its own folk come
#   stray_pool  where the strays come from: "all" (the default, as above) or "populations"
#              (only the types living in some branch or level with a danger of this campaign
#              or of none, uniques left out: a branch whose folk are a design's table)
#   above_danger  percent of draws made out of depth, above the floor's danger (default
#              `[defaults]`'s): one danger higher, then `deeper` % again and again one higher
#              still, with no cap (#1711: anything may come at astronomical odds); where `population` weighs
#              nothing that deep (all too weak), the generic list is drawn there instead
#   deeper     percent of each further step deeper (default `[defaults]`'s)
#   neutral    the weight, in percent of its own (default `[defaults]`'s), that a
#              type not hostile to the player by default (wildlife and the like) keeps in the
#              draws of a floor's population and its timed spawns; the hostile types take the
#              rest (a vault's pools and a teeming den draw as before)
#   dread_one_in  one draw in this many (0: none, default `[defaults]`'s) is made among the
#              dread types alone (a creature's `dread = true`), each by its level and rarity,
#              and every other draw among the rest; where the side rolled has nothing to draw,
#              the draw is made among the other. A vault's monster pool rolls none
#   spawn      `{ every = "15m", chance = 60, cap = N }` (the defaults; cap: the population):
#              while the player is on a floor, every `every` a creature comes with `chance` %
#              unless the floor holds `cap` creatures hostile to the player
#   room_effects  the level's own special-room odds, a table:
#              `chance` (percent a room is special), `per_level` (at most this many a level),
#              `favoured` (`{ id = share }`, ids in room_effects/, each its fixed percent of
#              the draws) and `banned` (ids never drawn); each field defaults to
#              room_effects/'s, e.g. `room_effects = { chance = 25, favoured = { flooded = 40 } }`
#   shops      the level's own shop odds, a table: `chance` (percent of its
#              rooms levels with a shop), `kinds` (ids in shops.toml, picked
#              uniformly; default every kind with `generated`), `names` (the keepers' names), `keeper` (the keepers' creature type;
#              they carry the shared `[keeper]`'s kit); each field defaults to shops.toml's,
#              e.g. `shops = { chance = 0 }` for none
#   vaults     vault ids, shared or the branch's campaign's: each stamped on every level with
#              the field for certain, and never drawn at random anywhere, e.g. `vaults =
#              ["drakes_hoard"]` (usually a row's)
#   hidden     `{ id, terrain, to, name }`: a hidden location on a cell of floor the generator
#              picks, the far end of a hand-made level's hidden way of the same id
#              (docs/dev/overworld.md); on one level only, so a row of one level's
#   [[dungeon.levels]]  per-depth rows, first match wins: `from`, `to` (inclusive; default
#              `from`), and any of the level fields above, over the template's
#
# [defaults] (this file only; required once any branch or level has a danger): the odds every
# area with a danger draws by unless it gives its own `stray`, `above_danger`, `deeper`,
# `dread_one_in`, and `neutral` (`dread_one_in` defaults
# to 100, `neutral` to 100).
#
# Generators build with the terrain void, wall, floor, door_closed, door_open, stairs_up,
# stairs_down, water, sconce, fungus and the light lamp, and stamp vaults (assets/vaults). Their
# parameters are data/generators.toml's.

[defaults]
# Percent of draws from the generic creature list.
stray = 5
# Percent of draws made out of depth, above the floor's danger: one danger higher ...
above_danger = 5
# ... then this percent, again and again, one higher still, with no cap.
deeper = 5
# One draw in this many is made among the dread types alone, every other among the rest
# (docs/design/monster-dread.md §8; the owner: "let's increase the default to 1-in-100").
dread_one_in = 100
# Neutral animals keep this percent of their weight in a dungeon's draws (#1195; the owner: "it's
# a game about killing stuff, not Dwarf Fortress").
neutral = 10
