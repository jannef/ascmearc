# Invisible (docs/dev/creatures.md "The unseen"): what a creature's `[creature.invisible]` gives
# it, two minutes of it, and the one status nobody sees: its sufferer is out of the player's
# sight however lit and near (`unseen`), and out of the sight of any creature not Seeing nor
# eyeless (`unseen::invisible_to`). The potion of the unseen and the dev `afflict:invisible`
# give it to the player, who is told.
[[status]]
id = "invisible"
name = "Invisible"
max = 1
stacking = "refresh"
eases = 120
unseen = true
start = "You fade from sight."
end = "You can see yourself again."
