# A curse (#1754): the piece is heavier, the reverse of Featherweight (one category, so an item is
# never both). Rolled only on found loot and creature gear, very rarely; once worn it will not
# come off (crates/ascmearc-core/src/world/items/curse.rs).
[[prefix]]
id = "leaden"
name = "Leaden"
effect = "weight"
category = "weight"
cursed = true
bases = ["weapon", "launcher", "body", "helmet", "cloak", "gloves", "boots", "shield", "tool"]
weight = 4
tiers = [
  { level = 1, min = 25, max = 50 },
  { level = 16, min = 40, max = 75 },
  { level = 32, min = 60, max = 100 },
]
