# A long-stemmed pipe: a halfling's own craft (`race`), Woodcraft's, with a knife carried and no
# station (docs/design/recipes.md §6 "Gems, coins, miscellaneous"; docs/dev/crafting.md "Pipes").
# The bowl is any wood; the mouthpiece may be trimmed in bone, horn, ivory, dragonbone, or amber,
# or left of the bowl's wood (None: `brittle` is the pipe itself, all of the bowl's wood). The
# check grades it as any made item (a pipe's one aspect is its make), and `finer` raises a made
# pipe's grade by the wood and the trim, to Masterwork at most. The stock is priced by the
# weight.
[[recipe]]
id = "pipe"
result = { object = "pipe" }
difficulty = 7
seconds = 600
knife = true
race = "halfling"
brittle = "pipe"

[recipe.parts]
main = { stock = ["wood"] }
mouthpiece = { stock = ["bone", "amber"], optional = true }

[recipe.finer]
main = { hardwood = 1, ironwood = 2 }
mouthpiece = { bone = 1, horn = 1, amber = 1, ivory = 2, dragonbone = 2 }
