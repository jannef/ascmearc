# The craftsperson's class ability from level 25 (Trapwright; the
# craftsperson design §7.6): an active of the abilities menu's Class group, the rig list then a
# direction; every kobold holds it from level 1 (races.toml `talents`), the ability menu's Class group lists it for any holder (`rig:tripwire:E`, `world/crafting/rig.rs`, the rigs `data/rigs.toml`).
[[talent]]
id = "trapwright"
name = "Trapwright"
tree = "class"
granted = true
description = "You rig traps (an ability): a tripwire from arrows, stakes from a billet of wood, or a pitfall dug with a pick, on a cell beside you. A creature your trap kills is your kill."
effects = [{ kind = "rigs" }]
systems = ["traps"]
