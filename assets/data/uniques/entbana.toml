# Entbana (#2134, the owner's design): a sling for the drop pool (#2103; placed nowhere else but
# the test world's quarry), item level 40 as the pool's are (docs/design/item-level-40.md §10).
# The giant-slayer: a bane against every creature larger than Small, +6 to hit and damage, and
# nothing against the small (its power, Feller, read where banes are summed:
# `world/combat/bane.rs`; a power, never an affix, so no pool rolls it). Sharp +5, of Precision
# +4, Hunter's +4 (range), as the design writes them. Every value set by hand
# (docs/dev/magic-items.md "Unique items").
#
# Waits for #2152 (uniques follow no affix rules): the design's Steady +4 belongs in `affixes`
# ("steady=4"), but the loader still refuses it on a sling ("its effect does nothing on slings":
# Steady lowers a bow's Strength to draw, and a sling has none). Add it back once #2152 lands.
[[unique]]
id = "entbana"
name = "Entbana"
# Of the drop pool: a rare find may be it instead (#2103; docs/dev/magic-items.md "The drop pool").
pool = true
object = "sling"
affixes = ["sharp=5", "of_precision=4", "hunters=4"]
level = 40
power = { feller = { larger_than = "small", bonus = 6 }, phrase = "The bigger they are, the surer and the harder its stones strike them. Against the small it is only a sling." }
lore = "A stone, a strap, and a steady eye. The rest is in the songs."
