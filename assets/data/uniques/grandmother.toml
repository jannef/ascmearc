# The Grandmother (#1976, #2091): a mithril great sword for the drop pool to come (#196; placed
# nowhere yet but the test world's quarry). Raw weight past any rare great sword's at item level
# 40 (docs/design/item-level-40.md §10): +10 damage and six more d6 (Sharp and Heavy far above
# their top tiers, +7 and 2d10), a sure, strong arm (+6 to hit, +6 Strength), and a swing so
# heavy it leaves its wielder open (−2 to Parry: a penalty only a unique carries). Every value
# set by hand (`=`), so a regrade of the tiers leaves it as it is (docs/dev/magic-items.md
# "Unique items").
[[unique]]
id = "grandmother"
name = "the Grandmother"
object = "great_sword"
affixes = ["sharp=10", "heavy=6d6", "guarding=-2", "of_precision=6", "of_the_bear=6"]
level = 40
# Its make holds six enchantments (docs/dev/enchanting.md): Masterwork mithril.
quality = "masterwork"
parts = [{ of = "mithril" }]
power = { inflict = "bleeding", chance = 50, severity = 1, phrase = "Its cuts are slow to close." }
lore = "She has outlived three houses, and buried every son who bore her."
