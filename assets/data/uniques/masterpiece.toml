# The Masterpiece (#2100, the owner's design): a mithril chain mail shirt for the drop pool
# (#2103; placed nowhere else but the test world's quarry), item level 40 as the pool's uniques are
# (docs/design/item-level-40.md §10). Very light: Featherweight 70 stacked on mithril's own half,
# 15% of a steel shirt (1,650 g of 11,000). +5 Defence (of Warding's Deflection) and +5
# Protection, both past their affixes' top tiers; Mage-wrought 10 takes off all of the shirt's
# spell cost, so it hinders no casting. Its power: half the hits that beat its wearer's Defence
# come to nothing (`world/combat/negate.rs`). Every value set by hand (`=`), so a regrade of the
# tiers leaves it as it is (docs/dev/magic-items.md "Unique items").
[[unique]]
id = "masterpiece"
name = "the Masterpiece"
# Of the drop pool: a rare find may be it instead (#2103; docs/dev/magic-items.md "The drop pool").
pool = true
object = "chain_mail"
affixes = ["featherweight=70", "hardened=5", "mage_wrought=10", "of_warding=5"]
level = 40
# Mithril binds two more enchantments (docs/dev/enchanting.md): its four need no better make, and
# a make's improvements would add Defence and Protection past the owner's +5 each.
parts = [{ of = "mithril" }]
power = { negate = 50, message = "The blow comes to nothing against your mail.", phrase = "Many a blow that finds it comes to nothing." }
lore = "The smith who made it laid down his hammer after, for there was nothing left to better."
