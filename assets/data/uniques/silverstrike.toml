# Silverstrike (#1976): a long war bow for the drop pool to come (#196; placed nowhere yet but the
# test world's quarry). It shoots twice as far as any long bow (its Range power, a multiplier on
# its range), and surely: +6 to hit (above the accuracy affixes' top tier), a wider critical, and
# an easier draw. Every value set by hand (`=`), so a regrade of the tiers leaves it as it is
# (docs/dev/magic-items.md "Unique items").
[[unique]]
id = "silverstrike"
name = "Silverstrike"
# Of the drop pool: a rare find may be it instead (#2103; docs/dev/magic-items.md "The drop pool").
pool = true
object = "long_bow"
affixes = ["keen=2", "steady=4", "of_precision=6"]
level = 12
# Three enchantments need its make (docs/dev/enchanting.md): Marvellous.
quality = "marvellous"
power = { range = 2, phrase = "Its arrows fly twice as far as a bow's." }
lore = "Its string, the bowyers swore, was spun from a hair of the moon."
