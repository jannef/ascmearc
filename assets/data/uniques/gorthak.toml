# Gorthak (#2136): a great axe for the drop pool (#2103; placed nowhere else but the test
# world's quarry), item level 40 as the pool's uniques are (docs/design/item-level-40.md §10).
# Every kill with it is a roar (its Roar power, `world/combat/roar.rs`): each foe within 6 cells
# that sees the wielder checks its nerve as against the Intimidate skill (its Willpower against
# the wielder's Strength and Intimidate); a failed one is Frightened for 2d4 degrees (Frightened
# holds 3 at most) and flees, and is not checked again until the fight is over for it. The
# undead, the mindless, and the fearless pay no heed. The roar is loud (40, where the wielder
# stands), and the noise brings more than it frightens. Sharp +6, Heavy 2d10 (the ladder's top),
# Brutal (a critical rolls the damage once more), +6 Strength (of the Bear), and the design's
# Leaden −20% as Featherweight −20 (20% heavier; Leaden is a curse that would bind). Its make,
# Fine. Every value set by hand
# (docs/dev/magic-items.md "Unique items").
[[unique]]
id = "gorthak"
name = "Gorthak"
# Of the drop pool: a rare find may be it instead (#2103; docs/dev/magic-items.md "The drop pool").
pool = true
object = "great_axe"
affixes = ["sharp=6", "heavy=2d10", "brutal=1", "featherweight=-20", "of_the_bear=6"]
level = 40
quality = "fine"
power = { roar = 6, status = "frightened", turns = "2d4", noise = 40, phrase = "Its every kill is a roar: the foes who see it may lose their nerve and flee." }
lore = "When it comes down there is a shout, and nobody is sure whose."
