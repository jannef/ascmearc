# An altar room: an altar in its middle, hallowed (good), old (unaligned), or unhallowed (evil),
# its side drawn by the dungeon level's `altars` weights (data/altars.toml's by default) and shown
# by its glow (data/altars.toml; `sides` marks that it has one). Pray beside one that names no
# church: data/outcomes/forgotten_altar.toml has what a prayer draws.
[[effect]]
id = "altar"
name = "altar room"
mark = "a"
enter = "An altar stands here."
near = "A faint glow rises from an altar ahead."
weight = 8
min_cells = 9
feature = "altar"
sides = { good = "altar_good", evil = "altar_evil" }
offers = { pray = "forgotten_altar" }
