# The top of Wedertorr (#1786; docs/design/wizard-tower.md §3, §7, §10.2; docs/dev/towers.md):
# Mistress Ælfswīð's workroom and quarters, the hand-made level the highest trap floor's `<` leads
# to (data/dungeons/wedertorr_tower.toml's `top`). The clearing's size, the tower on the same
# cells, and its `>` back down in the south-east corner, where the stair through the tower ends
# (`Content::fit_tower` checks both). Outside the tower the open air (_), four storeys over the
# down (`below`, `storey`): its seen cells show the grass and the stones below.
#
# Three rooms. East, her workroom: the stair down, a work table (T), a brazier (B), wall torches,
# the storm-glass she reads the weather by (G, a named place), and the wizard herself (A; her
# words: data/dialogue/wedertorr.toml). In the middle, her library: stacks of shelves (h) and a
# lamp. West, her quarters: a bed (b), a table and a stool, a shelf, a lamp, a brazier, and her
# cat. North, through either door, the balcony across the
# whole width of the tower, open to the sky and the weather, with a parapet round it: the
# storm-caller's roof, facing the weather's way. No traps and no population: a home.
