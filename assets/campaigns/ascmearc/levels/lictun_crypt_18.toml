# Līctūn crypt 18, "the bone cave" (#1685): the eighteenth crypt under Līctūn, below Līctūn crypt
# 17, reached by the stairs that open there once its places are filled (`docs/dev/graves.md`). Its
# stairs up (<) lead back to Līctūn crypt 17. No danger, nobody here.
#
# No one built this: a cave in the rock, two hollows joined by a narrow throat. The first people
# of this place laid their dead in its clefts (the niches) and left the bones of the beasts they
# ate in heaps on the floor (B); stones have fallen from the roof since. One cleft is sealed (F).
# A little fungus glows on the damp. Places for statues across both hollows (S). A gap in the
# east wall is the way down to the next crypt (v), shut until every place here is filled.
#
# Places: 27 niches, filled in row order.
name = "Līctūn crypt 18"
arrival = "Līctūn crypt 18, the bone cave: a cave of two hollows, the dead in its clefts and beasts' bones on its floor."
temperature = 2
ambient = [6, 6, 8, 0]
item_level = 1
map = '''
