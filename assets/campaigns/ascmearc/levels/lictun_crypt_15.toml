###########,,,,,,,,N#N###############N#N#,,,,,,,,###########
#############N#N#,,,,,,,,##########,,,,,,,,N#N##############
#################,,,,,,,,N#N###N#N#,,,,,,,,#################
###################N#N#,,,,,,,,,,,,,,N#N####################
#######################,,,,,,,,,,,,,,#######################
#########################N#N#,,N#N##########################
#############################,,#############################
##########################,,,,,,,,##########################
#########################S,,,,,,,,S#########################
########################i,,,,F,,,,,i########################
#########################S,,,,,,,,S#########################
##########################,,,,,,,,##########################
############################################################
############################################################
'''

[burial]
chain = "lictun"
depth = 15
epitaph = "Here lies {name}, {death}. Laid in the earth-house, out of the wind."

[legend]
"#" = "packed_earth"
"," = "dusty_floor"
"N" = "empty_niche"
"i" = "candles"
"t" = "sconce"
"<" = { terrain = "stairs_up", to = "lictun_crypt_14" }
"S" = { terrain = "dusty_floor", statue_place = true }
"v" = { terrain = "dusty_floor", burial_stairs = "stairs_down" }
"F" = { terrain = "sarcophagus", epitaph = "A stone box under a heap of pebbles. No words; a jet bead lies on its lid." }
