# Līctūn crypt 15, "the earth-house" (#1685): the fifteenth crypt under Līctūn, below Līctūn crypt
# 14, reached by the stairs that open there once its places are filled (`docs/dev/graves.md`). Its
# stairs up (<) lead back to Līctūn crypt 14. No danger, nobody here.
#
# An earth-house: a long low passage dug in the clay, bending like a bow, where a farmstead once
# kept its grain out of the frost. Later its people laid their dead in niches cut in pairs along
# both walls. From the bottom of the bend a creep goes down to a small round chamber, where the
# first of them lies under a stone box (F), places for statues round it (S). The passage's east
# end is the way down to the next crypt (v), shut until every place here is filled.
#
# Places: 32 niches, filled in row order.
name = "Līctūn crypt 15"
arrival = "Līctūn crypt 15, the earth-house: a long low passage dug in the clay, bending like a bow."
temperature = 3
ambient = [6, 6, 8, 0]
item_level = 1
map = '''
