# Drytorr's clearing and ground floor (#1784; docs/design/wizard-tower.md §3; docs/dev/towers.md):
# a hand-made outdoor level, a clearing in Holegnwudu with Master Ordgar's tower standing in it,
# entered from its hidden cell on the Ascmearc's overworld (I, at 19, 11; revealed by Gammer
# Wynflæd's "A sprig of rowan"), arriving on the track from the south (@). Like any outdoor area
# it is left by walking off its edge (or with `<` when no enemy is about and not on the stair).
#
# The tower (W, 21×13 at (20, 4)–(40, 16)) is dressed stone no pick or blast breaks, roofed, with
# unglazed windows (=): from outside they show the hall, from inside the wood. The box of its walls
# is the footprint every floor above is built on (data/dungeons/drytorr_tower.toml). Its inside
# is the ground floor, the first of the wizard's trap halls: in through the door (+) from the
# track, the south hall, with two hidden traps across it (A, S); the way on at its west end; the
# north hall, where three bays in the partition hold a known trap each (an arrow trap, a spear
# trap, a pit) with something left behind it to tempt a caller; and the stair up (<) in the middle
# of the north wall. Wall torches (t) light it; a brass plaque by the door is Ordgar's.
#
# The level's danger (5) is for the traps' growth (`TrapDef::effect_at`); a level's danger needs
# a population, so the wood keeps a few wolves and boar, coming now and then (the design's §12).
name = "Drytorr"
kind = "outdoor"
arrival = "A clearing in the holly wood, and a tower of dressed grey stone standing in it, taller than the trees."
danger = 5
population = ["boar", "wolf"]
population_count = 3
stray = 0
spawn = { every = "30m", chance = 40, cap = 3 }
map = '''
