"s" = { terrain = "tower_floor", trap = "spear", known = true }
"p" = { terrain = "tower_floor", trap = "pit", known = true }
"!" = { terrain = "tower_floor", objects = ["potion_of_healing"] }
"?" = { terrain = "tower_floor", objects = ["scroll_of_identify"] }
"$" = { terrain = "tower_floor", objects = ["gold_coin*25"] }
