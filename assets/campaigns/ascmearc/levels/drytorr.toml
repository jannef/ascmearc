# Drȳtorr's clearing and ground floor (#1784; docs/design/wizard-tower.md §3; docs/dev/towers.md):
# a hand-made outdoor level, a clearing in Holegnwudu with Master Ordgar's tower standing in it,
# entered from its hidden cell on the Ascmearc's overworld (I, at 19, 11; revealed by Gammer
# Wynflæd's "A sprig of rowan"), arriving on the track from the south (@). Like any outdoor area
# it is left by walking off its edge (or with `<` when no enemy is about and not on the stair).
#
# The tower (W, 41×19 at (20, 6)–(60, 24); #1823 made it this big, so the generated floors above
# have room for rooms and halls) is dressed stone no pick or blast breaks, roofed, with unglazed
# windows (=): from outside they show the halls, from inside the wood. The box of its walls is the
# footprint every floor above is built on (data/dungeons/drytorr_tower.toml). Its inside is the
# ground floor, the first of the wizard's trap halls, in three bands: in through the door (+)
# from the track, the entrance hall, with two hidden traps across it (A, S), the porter's lodge
# west of it and a store east; the way on at its west end, into the long gallery, where statues
# (I) stand and two gargoyles (G) sit among them as still; the way on at the gallery's east end,
# into the north hall, where three bays in its south side hold a known trap each (an arrow trap,
# a spear trap, a pit) with something left behind it to tempt a caller, the library west of it
# and a workshop east; and the stair up (<) in the middle of the north wall. Wall torches (t)
# light it; a brass plaque by the door is Ordgar's.
#
# The level's danger (5) is for the traps' growth (`TrapDef::effect_at`); a level's danger needs
# a population, so the wood sends a few of the fair folk's small fey, sprites and pixies, now and
# then (the design's §12 fallback). They are Ælfhām's own: every level's population joins its
# campaign's stray lists (`Content::fill_generic`), and these add nothing new to any branch's.
name = "Drȳtorr"
kind = "outdoor"
arrival = "A clearing in the holly wood, and a tower of dressed grey stone standing in it, taller than the trees."
danger = 5
population = ["sprite", "pixie"]
population_count = 3
stray = 0
spawn = { every = "30m", chance = 40, cap = 3 }
