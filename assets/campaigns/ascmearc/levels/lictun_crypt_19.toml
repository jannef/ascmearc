# Līctūn crypt 19, "the river cave" (#1685): the nineteenth crypt under Līctūn, below
# Līctūn crypt 18, reached by the stairs that open there once its places are filled (spec §7
# "Graves"; `docs/dev/graves.md`). Its stairs up (<) lead back to Līctūn crypt 18. No danger,
# nobody here.
#
# A cave a river runs through: it comes out of the rock in the north and goes back into it in the
# south, cold and quick, and a ford of flat stones crosses it in the middle. Its dead lie in
# niches on both banks; one, by the stairs, is sealed (F). Fungus grows by the water. Places for
# statues on both banks (S). A gap in the east wall is the way down to the next crypt (v), shut
# until every place here is filled.
#
# Places: 24 niches, filled in row order.
name = "Līctūn crypt 19"
arrival = "Līctūn crypt 19, the river cave: a black river crosses the cave, and the dead lie on both its banks."
temperature = 2
