# Līctūn crypt 16, "the barrow" (#1685): the sixteenth crypt under Līctūn, below
# Līctūn crypt 15, reached by the stairs that open there once its places are filled (spec §7
# "Graves"; `docs/dev/graves.md`). Its stairs up (<) lead back to Līctūn crypt 15. No danger,
# nobody here.
#
# The inside of a great round barrow, heaped up over its dead long before the Britons: bare earth
# walls, a passage straight through from west to east. Stone coffins stand in a ring round a kerb
# of standing stones, and inside the kerb the barrow's lord lies in the great cist it was raised
# for (F), a candle each side, places for statues about him (S). The passage's east end is the
# way down to the next crypt (v), shut until every place here is filled.
#
# Places: 20 stone coffins, filled in row order.
name = "Līctūn crypt 16"
arrival = "Līctūn crypt 16, the barrow: the inside of a great mound, stone coffins in a ring about a ring of stones."
temperature = 3
ambient = [6, 6, 8, 0]
item_level = 1
