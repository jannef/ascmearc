# Wedertorr's clearing and ground floor (#1786; docs/design/wizard-tower.md §3; docs/dev/towers.md):
# a hand-made outdoor level, the open top of a down on Hlāwdūn with Mistress Ælfswīð's tower
# standing on it, entered from its hidden cell on the Ascmearc's overworld (W, at 42, 23; revealed
# by Master Ordgar's quarrel), arriving on the track from the south (@). Like any outdoor area it
# is left by walking off its edge (or with `<` when no enemy is about and not on the stair).
#
# The tower (W, 41×19 at (15, 4)–(55, 22): a wizard's tower is big, docs/dev/towers.md "A
# tower's household") is dressed stone no pick or blast breaks, roofed, with unglazed windows
# (=). The box of its walls is the footprint every floor above is built on
# (data/dungeons/wedertorr_tower.toml). Its inside is the ground floor, the first of the wizard's
# trap halls: in through the door (+) from the track, the south hall, with two hidden traps
# across it (L, a lightning trap; F, a frost trap); the way on at the partition's east end; the
# north hall, pillared, where three bays in the north wall hold a known trap each (a lightning
# trap, a frost trap, a pit) with something left behind it to tempt a caller; a cloak room off it
# to the west (shelves, a table, a scroll left lying); and the stair up (<) at the hall's
# north-west corner. Wall torches (t) light it; a brass plaque by the door is Ælfswīð's. East of
# the tower, a ring of old standing stones (n).
#
# The level's danger (7) is for the traps' growth (`TrapDef::effect_at`); a level's danger needs
# a population, so the downs send a will-o'-wisp or a barrow spider now and then (the design's §12
# fallback). Both already live in the campaign's branches (Fennmynster and Wyrtholm, Cealdhlāw
# and Bānfeld): every level's population joins its campaign's stray lists (`Content::fill_generic`),
# and these add nothing new to any branch's.
name = "Wedertorr"
kind = "outdoor"
arrival = "The bare top of a down, the wind always at it, and a tower of grey stone standing alone on it."
danger = 7
population = ["will_o_wisp", "barrow_spider"]
population_count = 2
stray = 0
spawn = { every = "30m", chance = 30, cap = 2 }
