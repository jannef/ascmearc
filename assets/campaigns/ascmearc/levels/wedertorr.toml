"L" = { terrain = "tower_floor", trap = "lightning_bolt" }
"F" = { terrain = "tower_floor", trap = "frost" }
# The cloak room: shelves, a table, and a scroll left on the floor.
"h" = "shelves"
"T" = "table"
"C" = { terrain = "tower_floor", objects = ["scroll_of_lightning"] }
