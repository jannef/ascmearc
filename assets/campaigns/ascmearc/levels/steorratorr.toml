# Steorratorr's clearing and ground floor (#1787; docs/design/wizard-tower.md §3; docs/dev/towers.md):
# a hand-made outdoor level, the open plain on the shore of Grægsæ with Master Sigeric's tower
# standing on it, entered from its hidden cell on the Ascmearc's overworld (S, at 103, 40;
# revealed by Master Ordgar's quarrel), arriving on the track from the south (@). Like any outdoor
# area it is left by walking off its edge (or with `<` when no enemy is about and not on the
# stair).
#
# The tower (W, 41×19 at (15, 4)–(55, 22): a wizard's tower is big, docs/dev/towers.md "A
# tower's household") is dressed stone no pick or blast breaks, roofed, with unglazed windows
# (=). The box of its walls is the footprint every floor above is built on
# (data/dungeons/steorratorr_tower.toml). Its inside is the ground floor, the first of the
# wizard's trap halls: in through the door (+) from the track, the south hall, Sigeric's gallery
# of himself, four statues of the wizard along its north wall (named places: look mode reads
# their plinths) and three hidden traps across it (J, a teleport trap; F, a fireball trap; L, a
# lightning trap); the way on at the partition's west end; the north hall, pillared, where three
# bays in the north wall hold a known trap each (a lightning trap, a frost trap, a pit) with
# something left behind it to tempt a caller; a cabinet of curiosities off it to the west through
# a door (shelves, a table, a scroll left lying); and the stair up (<) at the hall's north-east
# corner. Wall torches (t) light it; a brass plaque by the door is Sigeric's. East of the tower,
# the plain runs down over rocks and reeds into the grey sea.
#
# The level's danger (9) is for the traps' growth (`TrapDef::effect_at`); a level's danger needs
# a population, so the drowned walk up out of the sea now and then, and a lesser water elemental
# with them (the design's §12 fallback). Both already live in the campaign's branches
# (Fennmynster): every level's population joins its campaign's stray lists
# (`Content::fill_generic`), and these add nothing new to any branch's.
name = "Steorratorr"
kind = "outdoor"
arrival = "A green plain running down to the grey sea, and on it, taller than anything for miles, a tower of white stone."
danger = 9
population = ["drowned", "lesser_water_elemental"]
population_count = 2
stray = 0
spawn = { every = "30m", chance = 30, cap = 2 }
map = '''
