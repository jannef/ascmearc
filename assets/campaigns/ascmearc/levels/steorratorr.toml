[legend]
"." = "grass"
'"' = "tall_grass"
";" = "dry_grass"
"%" = "rocky_ground"
"*" = "flowers"
"o" = "boulder"
"b" = "bush"
"r" = "reeds"
"~" = "shallow_water"
"w" = "water"
"D" = "deep_water"
"," = "dirt_road"
"W" = "tower_wall"
":" = "tower_floor"
"=" = "window"
"+" = "door_closed"
"t" = "sconce"
"@" = { terrain = "dirt_road", spawn = "player" }
# The stair up, through every floor of the tower (data/dungeons/steorratorr_tower.toml).
"<" = { terrain = "stairs_up", to = "steorratorr_tower:1" }
# Sigeric's plaque, on the wall east of the door (a named place: look mode reads it).
"Q" = { terrain = "tower_wall", name = "a brass plaque", note = "Polished brass, very bright: STEORRATORR. THE HOUSE OF MASTER SIGERIC, MAKER. Smaller, under it: Callers are expected to be impressed." }
# The gallery: four likenesses of the wizard, the last still to come.
"S" = { terrain = "statue", name = "a statue of Master Sigeric", note = "A young man in a scholar's gown, a book under one arm. The plinth reads: SIGERIC, AT HIS STUDIES." }
"U" = { terrain = "statue", name = "a statue of Master Sigeric", note = "A man in his prime, one hand raised, a gilt star in the palm. The plinth reads: SIGERIC, AT HIS FIRST WONDER." }
"V" = { terrain = "statue", name = "a statue of Master Sigeric", note = "A man in a robe sewn with stars, looking up. The plinth reads: SIGERIC, RAISING HIS TOWER." }
"Y" = { terrain = "statue", name = "a plinth", note = "Polished, and waiting for its statue. The plinth reads: SIGERIC, TRIUMPHANT." }
# The bays: a known trap in each, and behind it what a caller is meant to want.
"l" = { terrain = "tower_floor", trap = "lightning_bolt", known = true }
"f" = { terrain = "tower_floor", trap = "frost", known = true }
"p" = { terrain = "tower_floor", trap = "pit", known = true }
"!" = { terrain = "tower_floor", objects = ["potion_of_greater_healing"] }
"?" = { terrain = "tower_floor", objects = ["scroll_of_haste"] }
"$" = { terrain = "tower_floor", objects = ["gold_coin*60"] }
# The south hall's hidden traps, across the way from the door to the way on.
"J" = { terrain = "tower_floor", trap = "teleport" }
"F" = { terrain = "tower_floor", trap = "fireball" }
"L" = { terrain = "tower_floor", trap = "lightning_bolt" }
# The cabinet of curiosities: shelves, a table, and a scroll left on the floor.
"h" = "shelves"
"T" = "table"
"C" = { terrain = "tower_floor", objects = ["scroll_of_fireball"] }
