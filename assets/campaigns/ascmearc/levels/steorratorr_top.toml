# The top of Steorratorr (#1787; docs/design/wizard-tower.md §3, §7, §10.2; docs/dev/towers.md):
# Master Sigeric's workshop and quarters, the hand-made level the highest trap floor's `<` leads
# to (data/dungeons/steorratorr_tower.toml's `top`). The clearing's size, the tower on the same
# cells, and its `>` back down in the south-west corner, where the stair through the tower ends
# (`Content::fit_tower` checks both). Outside the tower the open air (_), six storeys over the
# plain (`below`, `storey`): its seen cells show the grass, the shore, and the grey sea below.
#
# South-west, the landing: the stair down, a wall torch, a brazier. North of it, through a door,
# his quarters: a bed (b), a table and a stool, shelves, a lamp, a brazier, and his cat. East,
# through either door, his workshop, the tower's whole middle: shelves along the north wall, two
# workbenches (k), an anvil (K), tables, braziers, lamps, the orrery he is proudest of (O, a named
# place), and the wizard himself (A; his words: data/dialogue/steorratorr.toml). East of it,
# through two doors, the balcony down the tower's whole east side, open to the sky and the sea
# wind, with a parapet round it and his telescope (G, a named place): the star tower's roof,
# facing the sea. No traps and no population: a home.
