# The top of Drȳtorr (#1784; docs/design/wizard-tower.md §3, §7, §10.2; docs/dev/towers.md): Master
# Ordgar's study and quarters, the hand-made level the highest trap floor's `<` leads to
# (data/dungeons/drytorr_tower.toml's `top`). The clearing's size, the tower on the same cells,
# and its `>` back down in the north-west corner, where the stair through the tower ends
# (`Content::fit_tower` checks both). Outside the tower the open air (_), three storeys over the
# clearing (`below`, `storey`): its seen cells show the wood below.
#
# Three rooms under the roof (#1823 made the tower bigger). West, the study: the stair down,
# shelves of books (h), the reading table (T) with the wizard at it (O; his words:
# data/dialogue/drytorr.toml), a brazier (B), a lamp, and wall torches. In the middle, through a
# door, his library, row on row of shelves. East, his quarters: a bed (b), a table and a stool,
# more shelves, and his cat. South, through either door, the balcony: flagstones open to the sky
# and the weather, a parapet round it, and the wood falling away below. No traps and no
# population: a home.
name = "The Top of Drȳtorr"
kind = "outdoor"
below = "drytorr"
storey = 3
map = '''
