# A craftsperson's patron (#1421; world/crafting/patron.rs; the craftsperson design §7.4): a well-to-do
# burgher lodging at the Gæsthūs in Cēaptūn in the run of a craftsperson of level 12 or more, of
# the craftsperson's own race, speaking in that race's register (docs/dev/npcs.md "Speech by race
# and station"; a patron is a person of means, so a human one speaks posh).
# data/towns/ceaptun.toml names the npc for each race. Each has one-liners, said before
# `waiting`; `address`, how the patron addresses the player by gender (`{player:address}` in any
# of its lines); and `[dialogue.patron]`, said when spoken to: `offer` as a commission is given
# (`{work:a}` the thing asked for; the stock handed over with it is told after the line),
# `waiting` while one is open and nothing carried will do (`{work:a}`), `plain` when only a plain
# one is carried (`{work:a}`), `delivered` as the work is handed in (`{gold:name}` the price), and
# `idle` when nothing the player can make is worth commissioning. Slots take the base form only
# (docs/dev/localization.md "Dialogue").

# Humans, half-elves, and half-orcs: posh.
[[dialogue]]
npc = "patron"
register = "posh"
lines = [
    "One does like a well-made thing about the house.",
    "The Gæsthūs keeps a tolerable table, I find.",
    "Good work is never cheap, and cheap work is never good.",
]
address = { male = "sir", female = "madam", other = "my dear" }
[dialogue.patron]
offer = "Ah, {player:address}. I want {work:a}, Fine or better. Do take this stock for it, and do not keep me waiting too long."
waiting = "The stock I gave you was for {work:a}, {player:address}. I can wait; I would rather not."
plain = "That is {work:a}, {player:address}, and no more. I asked for Fine work."
delivered = "Splendid. Quite splendid. {gold:name} gold, as agreed, and worth every coin."
idle = "Come back when your hands are worth hiring, {player:address}."

# Dwarves and duergar: Geordie.
[[dialogue]]
npc = "patron_dwarf"
lines = [
    "Aa like a thing that's made proper, me.",
    "The Gæsthūs does a canny stew, like.",
    "Good work's never cheap, an' cheap work's never good, man.",
]
address = { male = "marra", female = "pet", other = "hinny" }
[dialogue.patron]
offer = "Now then, {player:address}. Aa want {work:a}, Fine or better, mind. Here's the stock for it."
waiting = "Aa gave ye that stock for {work:a}, {player:address}. Divvent dawdle, like."
plain = "That's {work:a} an' nowt more, {player:address}. Aa said Fine work, man."
delivered = "Eeh, that's canny work. {gold:name} gold, like we said, an' worth it."
idle = "Come back when yer hands are worth hirin', {player:address}."

# Elves: Brummie.
[[dialogue]]
npc = "patron_elf"
lines = [
    "I loike a thing that's made proper, I do.",
    "The Gæsthūs does a decent bit of grub, ar.",
    "Good work ain't cheap, and cheap work ain't good.",
]
address = { male = "bab", female = "bab", other = "bab" }
[dialogue.patron]
offer = "Alroight, {player:address}? I want {work:a}, Fine or better. Here's the stock for it, loike."
waiting = "That stock was for {work:a}, {player:address}. I'm not in a hurry, but I ain't patient neither."
plain = "That's {work:a}, {player:address}, and that's all it is. I asked for Fine work."
delivered = "Bostin'. Proper bostin'. {gold:name} gold, loike we said."
idle = "Come back when yower hands are worth hirin', {player:address}."

# Halflings and gnomes: Scouse.
[[dialogue]]
npc = "patron_halfling"
lines = [
    "I like a thing that's made proper, me.",
    "The scran in the Gæsthūs is boss, la.",
    "Good work's never cheap, and cheap work's never good.",
]
address = { male = "lad", female = "queen", other = "la" }
[dialogue.patron]
offer = "Alright, {player:address}? I want {work:a}, Fine or better. Here's the stock for it, la."
waiting = "That stock was for {work:a}, {player:address}. Get grafting, eh."
plain = "That's {work:a}, {player:address}, and nothin' more. I said Fine work."
delivered = "That's boss, that. {gold:name} gold, like we said."
idle = "Come back when yer hands are worth hirin', {player:address}."

# Goblins, kobolds, and ratfolk: a heavy Irish brogue.
[[dialogue]]
npc = "patron_goblin"
lines = [
    "I do like a t'ing dat's made proper, so I do.",
    "Dey keep a grand table at de Gæsthūs, sure.",
    "Good work's never cheap, an' cheap work's never good.",
]
address = { male = "boyo", female = "missus", other = "pet" }
[dialogue.patron]
offer = "Ah, {player:address}. I'm after {work:a}, Fine or better, so. Here's the stock for it."
waiting = "Dat stock was for {work:a}, {player:address}. I'm waitin' on it, so I am."
plain = "Dat's {work:a}, {player:address}, an' nuttin' more. I said Fine work, sure."
delivered = "Ah, grand job. {gold:name} gold, as we said, an' worth it."
idle = "Come back when yer hands are worth hirin', {player:address}."

# Drow: Middle English.
[[dialogue]]
npc = "patron_drow"
lines = [
    "Wel-wrought thinges plesen me.",
    "The Gæsthūs kepeth a goodly table.",
    "Good werk is nevere chepe, ne chepe werk good.",
]
address = { male = "sire", female = "dame", other = "frend" }
[dialogue.patron]
offer = "Wel met, {player:address}. I wolde have {work:a}, Fine or bettre. Here is the stuff therfore."
waiting = "That stuff was for {work:a}, {player:address}. I abyde, but nat for evere."
plain = "That is {work:a}, {player:address}, and namore. Fine werk I asked of thee."
delivered = "Certes, this is good werk. {gold:name} gold, as we acorded."
idle = "Com agayn whan thyn hondes ben worth the hiring, {player:address}."

# Lizardfolk: Dutch.
[[dialogue]]
npc = "patron_lizardfolk"
lines = [
    "Ik houd van goed gemaakte dingen.",
    "De Gæsthūs heeft een behoorlijke keuken.",
    "Goed werk is nooit goedkoop, en goedkoop werk nooit goed.",
]
address = { male = "meneer", female = "mevrouw", other = "vriend" }
[dialogue.patron]
offer = "Goedendag, {player:address}. Ik wil {work:a}, Fine of beter. Hier is de voorraad ervoor."
waiting = "Die voorraad was voor {work:a}, {player:address}. Ik wacht, maar niet eeuwig."
plain = "Dat is {work:a}, {player:address}, en meer niet. Ik vroeg om Fine werk."
delivered = "Prachtig werk. {gold:name} goud, zoals afgesproken."
idle = "Kom terug als uw handen het inhuren waard zijn, {player:address}."
