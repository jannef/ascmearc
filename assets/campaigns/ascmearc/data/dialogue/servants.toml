# An aristocrat's own servant (#1405; world/classes/stipend.rs): the squire, chambermaid, or servant who
# waits at Cēaptūn's Gæsthūs in an aristocrat's run, of the aristocrat's own race, and speaks in
# that race's register (docs/dev/npcs.md "Speech by race and station"; a servant is no lord, so a
# human one is a Cockney commoner). data/towns/ceaptun.toml names the npc for each race. Each
# has one-liners that flatter their better, `address`: how they address their master by gender
# (`{player:address}` in the lines and the handover), and `[dialogue.stipend]`: the line said as
# they hand over the family's stipend.

# Humans, half-elves, and half-orcs: Cockney.
[[dialogue]]
npc = "servant"
lines = [
    "A pleasure to see yer, {player:address}. The 'ole town's brighter for it, innit.",
    "Them boots, {player:address}! Fit for the King 'imself, they are.",
    "Word is yer slew a beast twice yer size, {player:address}. I always said yer would.",
    "I tells everyone at the Gæsthūs, {player:address}: there's none finer in the march than you.",
    "Yer bearin', {player:address}! Blood tells. Can't buy that, can yer.",
    "If yer don't mind me sayin', {player:address}, yer look more 'andsome every time.",
    "Yer family'd be proud of yer, {player:address}. Proud as punch.",
    "I keeps yer things ready, {player:address}, same as always. Nothin' but the best for yer.",
    "The rabble 'ere don't know quality, {player:address}. I do.",
]
address = { male = "m'lord", female = "m'lady", other = "guv'nor" }
[dialogue.stipend]
handover = "Yer family's sent yer stipend on, {player:address}, all counted proper. 'Ere it is, every penny."

# Dwarves and duergar: Geordie.
[[dialogue]]
npc = "servant_dwarf"
lines = [
    "Howay, {player:address}! Ye look grand the day, ye knaa. Like a king under the mountain.",
    "That beard of yours, {player:address}. Divvent let anyone tell ye different, it's canny.",
    "Aa telt them all at the inn: nee dwarf in the march stands taller than mine.",
    "Wey aye, {player:address}, the forge-folk sing of your deeds already.",
    "Ye've the old blood in ye, {player:address}. Ye can see it in the way ye walk.",
    "Aa keep your gear oiled and shinin', {player:address}. Only the best for wor house.",
    "Them goblins'll run when they hear you're comin', {player:address}. Mark us.",
    "Your da would be reet proud, {player:address}, so he would.",
]
address = { male = "me lord", female = "me lady", other = "your honour" }
[dialogue.stipend]
handover = "Word from hyem, {player:address}: your stipend, all of it, counted twice. Here ye gan."

# Elves: Brummie.
[[dialogue]]
npc = "servant_elf"
lines = [
    "Ow am ya, {player:address}? Bostin, as ever, I can see that.",
    "Yow walk loike the old songs, {player:address}. Light as anythin'.",
    "Them humans stare at yow, {player:address}. Can't blame 'em, can ya?",
    "I tell everyone, {player:address}: there's nobody noicer in all the march.",
    "A thousand years of good breedin', {player:address}. It shows, it does.",
    "Yower hair, {player:address}! Loike moonlight on the brook.",
    "I've kept yower things just so, {player:address}. Nothin' but the best.",
    "The whole town's talkin' about yow, {player:address}. All good, mind.",
]
address = { male = "yer lordship", female = "yer ladyship", other = "yer honour" }
[dialogue.stipend]
handover = "Yower family's sent summat on, {player:address}: yower stipend, every bit. There yow go."

# Halflings and gnomes: Scouse.
[[dialogue]]
npc = "servant_halfling"
lines = [
    "Ey, {player:address}, ye look boss today. Proper boss.",
    "I'm made up just to see ye, {player:address}. Made up.",
    "Them big folk don't know quality, {player:address}. I do, la.",
    "Ye've got class, {player:address}. Ye can't learn that, can ye?",
    "I told the whole Gæsthūs, {player:address}: ye're the best in the march. Sound.",
    "Them kecks, {player:address}! Fit for a prince, them.",
    "I've got yer scran warm and yer boots shined, {player:address}. Only the best.",
    "Yer family'd be dead proud of ye, {player:address}. Dead proud.",
]
address = { male = "me lord", female = "me lady", other = "boss" }
[dialogue.stipend]
handover = "Yer family's sent yer stipend, {player:address}. All counted, la. Here, it's yours."

# Goblins, kobolds, and ratfolk: a heavy Irish brogue.
[[dialogue]]
npc = "servant_goblin"
lines = [
    "Ah, {player:address}, sure an' ye're a sight for sore eyes, so ye are.",
    "Begorrah, {player:address}, th' whole town's talkin' about ye. Grand t'ings, all of it.",
    "Would ye ever look at th' fine cut of ye, {player:address}. Like a king, so.",
    "Me oul' da always said I'd serve th' best, {player:address}. Tis yerself he meant.",
    "I tink ye're th' cleverest in th' whole march, {player:address}, an' I'm no eejit.",
    "Tis an honour t' polish yer boots, {player:address}. A feckin' honour.",
    "Them big folk are only jealous of ye, {player:address}. Pay 'em no mind.",
    "Ye've th' look of ould money about ye, {player:address}. Grand altogether.",
]
address = { male = "yer lordship", female = "yer ladyship", other = "yer honour" }
[dialogue.stipend]
handover = "Yer family's sent on yer stipend, {player:address}, an' not a coin missin', I swear it. Here, take it."

# Drow: Middle English.
[[dialogue]]
npc = "servant_drow"
lines = [
    "Hail, {player:address}. Thou art fairer than the moon that never shineth below.",
    "Certes, {player:address}, none in this sunlit town is thy peer.",
    "Ywis, {player:address}, thy house shall sing of thy deeds anon.",
    "The surface folk gape at thee, {player:address}, and well they may.",
    "In sooth, {player:address}, thy bearing sheweth thy noble blood.",
    "Thy gear I have kept clean, {player:address}, as befitteth thy rank.",
    "Thy mother's house would be glad of thee, {player:address}, and eek proud.",
    "Hast thou slain another foe, {player:address}? Thou art ever victorious.",
]
address = { male = "my lord", female = "my lady", other = "my liege" }
[dialogue.stipend]
handover = "Thy house hath sent thy stipend, {player:address}, y-counted every coin. Take it, I pray thee."

# Lizardfolk: Dutch.
[[dialogue]]
npc = "servant_lizardfolk"
lines = [
    "Goedendag, {player:address}. Uw schubben glanzen vandaag als goud.",
    "Niemand in deze stad is zo edel als u, {player:address}.",
    "De warmbloeden staren naar u, {player:address}. Begrijpelijk.",
    "Uw familie zou trots zijn, {player:address}. Heel trots.",
    "Ik heb uw spullen gepoetst, {player:address}. Alleen het beste voor u.",
    "Wat een houding, {player:address}! Echt van hoge afkomst.",
    "Iedereen in de herberg spreekt over uw daden, {player:address}.",
    "U wordt elke dag sterker, {player:address}. Dat zie ik meteen.",
]
address = { male = "heer", female = "vrouwe", other = "edele" }
[dialogue.stipend]
handover = "Uw familie stuurt uw toelage, {player:address}. Alles is geteld. Alstublieft."
