# Master Ordgar's quest (#1785; docs/design/wizard-tower.md §10, §11; the fields: data/quests.toml):
# the wizards' quarrel. Three wizards keep towers in the march, and two of them must fall. Ordgar
# gives it once the rowan is handed over; whichever wizard the player ends allied with pays, and
# teaches Spellcraft with their own second skill. The ally carries the hoard from then on, and the
# parting asks, once, whether the player leaves them or betrays them. The file is named for the
# chain it continues, so it loads after wynflaed.toml (`requires` names a quest loaded before).
#
# The three sides: Ordgar's, Mistress Ælfswīð's of Wedertorr (#1786), and Master Sigeric's of
# Steorratorr (#1787), each with their `[[quest.taker]]`; the two rivals with their
# `[[quest.side]]`, and their towers in `reveals`.
[[quest]]
id = "the_wizards_quarrel"
name = "The wizards' quarrel"
giver = "ordgar"
requires = "rowan_for_the_wizard"
type = "kill"
target = "tag:tower_wizard"
count = 2
what = "wizards"
alignment = 0
# The rivals' towers, marked on the map as the quest is given.
reveals = [{ location = "wedertorr" }, { location = "steorratorr" }]
feud = "feuding_wizards"
offer = "There are three of us in this country who may call ourselves wizards, and that is two too many. Mistress Ælfswīð and Master Sigeric want my books, my tower, and very likely my head. Two of us must fall. I should prefer it were not me."
accept = "Wedertorr stands on the downs past the old barrow; Steorratorr by the grey sea, and higher. I have marked them both for you. Their towers are taller than mine and their stairs no kinder. They will offer you terms; they always do. Drink their tea if you must, but sign nothing."
reminder = "Two wizards. I am told you are good on stairs, and I am still here, which is the half of it I like."
where = "Mistress Ælfswīð keeps a tower on the downs, Master Sigeric another by the grey sea; each keeps the top floor."

[[quest.taker]]
npc = "ordgar"
done = "Two of us, then, and I am the one still talking. I promised you the grammar, and here it is. Sit down; this will take some time, and none of it may be skipped."
reward = { gold = 200, xp = 900, items = ["grimoire_of_magic_missile"], skills = { spellcraft = { start = "1d4", marks = 100, taught = "Ordgar sits you down with a primer and does not let you up until the first page makes sense.", more = "You learn more of the weaving of spells." }, decipher_script = { start = "1d4", marks = 100, taught = "He shows you how a grimoire is read: slowly, and twice.", more = "You read the old hands more easily." } } }

[[quest.taker]]
npc = "aelfswith"
done = "Two down, and I'm still standing. Good. Sit. You'll learn to make a spell, and then you'll learn to keep one when the wind's trying to take it off you. Take the wand as well; it's quicker than either."
reward = { gold = 250, xp = 900, items = ["wand_of_lightning_bolt"], skills = { spellcraft = { start = "1d4", marks = 100, taught = "Ælfswīð shows you the shape of a spell once, quickly, and makes you do it until you have it.", more = "You learn more of the weaving of spells." }, concentration = { start = "1d4", marks = 100, taught = "She sends you out onto the balcony in a squall to hold a spell together until your hands stop shaking.", more = "You hold your mind steadier under strain." } } }
parting = "That's the end of it. You're paid, and I'm busy. Out you go, unless you've a better idea."
betrayed = "I wondered when you'd try. Come on, then. The weather's on my side."

[[quest.side]]
npc = "aelfswith"
offer = "Ordgar sent you. Of course he did; he never climbs anything. Here's a better offer. Take my side, finish the other two, and I'll teach you more than he can. Well?"
join = "Good. Quick, too. Ordgar will hear of it before the rain does, and so will Sigeric. Go and see to them."
refuse = "Then you're weather, and I deal with weather."

[[quest.taker]]
npc = "sigeric"
done = "Two of us gone, and the better one left standing; history so seldom manages it. You shall have your reward, and it shall be worthy of us both. Sit. We begin with spells, and we go on to making."
reward = { gold = 300, xp = 900, items = ["unique:sigerics_star"], skills = { spellcraft = { start = "1d4", marks = 100, taught = "Sigeric shows you a spell as a made thing, joint by joint, and has you build it after him until it stands.", more = "You learn more of the weaving of spells." }, enchanting = { start = "1d4", marks = 100, taught = "He sets a plain ring in your hand and talks you through persuading it to be something better.", more = "You see more clearly how a thing may be made more than it is." } } }
parting = "And so we part, as friends and as the two most accomplished people in the march. Unless you had something less graceful in mind."
betrayed = "How very disappointing. I had thought you had taste. Come, then; let us see what I make of you."

[[quest.side]]
npc = "sigeric"
offer = "Ordgar's errand-runner, at the top of my stair, and not even out of breath. Splendid. Let me make you a better offer than his. Take my side, see to the other two, and I shall teach you to make wonders. He will only teach you to read about them."
join = "Wise, and gracious with it. Ordgar and Ælfswīð will have heard by the time you reach the stair; they always do hear of me. Go and see to them, and come back to be thanked."
refuse = "A pity. I had such hopes for you. I shall make something of you yet, if only a doorstop."

[quest.parting]
text = "Well. That is the end of it, and you have what you came for. Unless you think you have not."
betray = "Ah. I did wonder whether you had read the whole of the bargain. Come, then."

# The spoils of the quarrel (§10.4): made at the hand-in and carried by the winner, dropped where
# they die. The same whoever wins.
[quest.hoard]
purse = { coins = { dice = "6d100" } }
rare = 2
item_level = 14
grimoires = 1
