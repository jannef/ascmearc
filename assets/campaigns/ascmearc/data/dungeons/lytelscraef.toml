# Lytelscræf, "the little cave" (#792; docs/design/campaign.md §5.8, §7.1; the fields:
# data/dungeons.toml): a cave in the foot of Grægweall, two cells from Beorggeat, where the
# player comes down. The Ascmearc's first and easiest dungeon: three short floors of vermin and
# a few kobolds, and the kobolds' cache at the bottom with a chest for certain.

[[dungeon]]
id = "lytelscraef"
name = "Lytelscræf"
arrival = "The cave smells of wet stone and rats."
generator = "caves"
depth = 3
# Short floors: the smallest caves the generator makes are 40x30.
size = [60, 30]
traps = ["pit", "arrow"]
traps_per_level = [1, 2]
loot = [1, 3]
temperature = 6
# Danger 1 on the first floor to 3 on the third; nothing scales with
# the player. The weakest of what lives in the campaign: rats, bats, beetles, grave worms, and
# kobolds, all of level 1 or 2, so a first-level character of any class can clear it.
# The mountain's foot: the common ores of the shallow rock (#1389, data/mining.toml).
ores = ["iron", "copper", "tin"]
danger = 1
population = ["rat", "bat", "beetle", "grave_worm", "kobold"]
# Only its own folk, and none drawn deeper: nothing tougher strays in.
stray = 0
out_of_depth = 0
# A thin population: about a dozen on a floor.
population_count = { per_1000 = 15, least = 8, most = 16 }
# A cave of vermin keeps no shop, and no special room: a teeming den's swarm would be too much for a
# first fight.
shops = { chance = 0 }
room_effects = { chance = 0 }

# The second floor keeps the top of the Skeul Hir, the deep gnomes' old long stair down to
# Gimmwīc (#1760, #1840; data/dungeons/skeul_hir.toml, whose `above` this floor is, and
# levels/gimmwic.toml's `H` at its bottom): a cell of plain floor its generation picks
# (mapgen/hidden.rs), the same for the same seed, that turns to stairs down when Peran gives the
# moot's answer (data/quests/wulfrun.toml `gnome_reply`).
[[dungeon.levels]]
from = 2
hidden = { id = "skeul_hir", terrain = "stairs_down", to = "skeul_hir:1", name = "the Skeul Hir" }

# The bottom: the kobolds' cache, with its chest.
[[dungeon.levels]]
from = 3
vaults = ["kobolds_cache"]
