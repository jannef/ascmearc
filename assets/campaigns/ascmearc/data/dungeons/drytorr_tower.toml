# Drȳtorr, "the wizard's tower" (#1784; docs/design/wizard-tower.md §3, §8, §9; the fields:
# data/dungeons.toml): Master Ordgar's tower in Holegnwudu. Four floors: the ground floor inside
# the tower on its clearing (levels/drytorr.toml), two generated trap floors above it
# (`drytorr_tower:1` and `:2`, "Drȳtorr 2" and "3"), and the hand-made top, the wizard's study
# and quarters with the balcony (levels/drytorr_top.toml). Each floor's `<` climbs, its `>` goes
# back down; the floors are the clearing's size, the tower on the same cells, and their windows
# look out over the wood below (docs/dev/towers.md).
#
# Pitched straight after Ælfhām (4 to 6): the ground floor's traps at danger 5, the trap floors at
# 6 and 7. The wizard's household keeps them: his books, brooms, candlesticks, chairs, coat
# stands, lanterns, and rugs, gone lively, and now and then a lesser earth elemental bound to the
# stones. Arrow and spear traps, alarms, and pits, all hidden.

[[dungeon]]
id = "drytorr_tower"
name = "Drȳtorr"
kind = "tower"
generator = "tower"
floors = 4
clearing = "drytorr"
top = "drytorr_top"
traps = ["arrow", "spear", "alarm", "pit"]
traps_per_level = [3, 5]
hidden_per_depth = 2
danger = { base = 6, per_depth = 1 }
population = [
    "animated_book", "animated_broom", "animated_candlestick", "animated_chair", "animated_coat_stand",
    "animated_lantern", "animated_rug", "lesser_earth_elemental",
]
population_count = { per_1000 = 40, least = 4, most = 9 }
# Only the household: nothing from outside finds its way up the stair.
stray = 0
shops = { chance = 0 }
room_effects = { chance = 0 }
