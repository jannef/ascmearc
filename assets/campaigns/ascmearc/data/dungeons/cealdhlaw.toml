# Cealdhlāw, "the cold barrow" (docs/design/campaign.md §7.1; the fields: data/dungeons.toml): the
# first dungeon of the Ascmearc, under Hlāwdūn east of Cēaptūn, its way in on the overworld from
# the start. Two levels of the barrow's passages, then four of the hill's hollows.

[[dungeon]]
id = "cealdhlaw"
name = "Cealdhlāw"
arrival = "Cold air breathes up from the mound."
depth = 6

[dungeon.level]
generator = { kind = "rooms" }
size = [80, 21]
traps = ["arrow", "spear", "pit", "alarm"]
# As the Depths: a secret door or two a rooms level, hidden things and locks harder deeper down.
secret_doors = [1, 2]
hidden_per_depth = 1
locks_per_depth = 1
loot = [2, 4]
key = "rusty_key"
# Cold, as a barrow is.
temperature = 8
# Danger 1 on the first floor to 6 on the sixth; nothing scales with
# the player. The barrow wave, and the vermin and kobolds that were there first; in the hill's
# hollows an orc war band (#455) camps beside the goblins. Among the grave goods, household
# things that will not lie still (#483: animated objects), and blades that dance alone (#485:
# the family `animated_blade`, levels 5 to 20, met from the fifth floor on).
# Hlāwdūn's rock: the copper and tin the barrow-builders' bronze came from, and iron (#1389,
# data/mining.toml).
ores = ["iron", "copper", "tin"]
danger = 1
population = [
    "rat", "bat", "beetle", "kobold", "kobold_archer", "kobold_shaman", "kobold_alchemist",
    "grave_worm", "crawling_hand", "skeletal_rat", "barrow_spider", "kobold_zombie", "goblin",
    "goblin_archer", "skeleton", "zombie", "giant_centipede", "barrow_ghoul", "skeleton_archer",
    "goblin_chief", "goblin_firebomber", "skeletal_wolf", "barrow_wight", "skeleton_warrior",
    "orc_runt", "orc_warrior", "orc_archer", "warg",
    "animated_candlestick", "animated_cutlery", "animated_teapot", "animated_cooking_pot",
    "animated_blade",
]
# 30 a thousand walkable cells: the least, 25, on the barrow's passages (about 350 cells) and in
# the hollows (about 750 cells of tunnels and caverns at 84×34, #1835; about 1 500 at 120×48, which
# was 45 a floor, and 2 300 when they were open caves of 100×40, which was 70).
population_count = { per_1000 = 30, least = 25, most = 80 }

# The barrow's heart: the barrow chamber, with the silver chalice on its plinth (Sister Hild's
# "Grave goods"), on the second floor for certain.
[[dungeon.levels]]
from = 2
vaults = ["barrow_chamber"]

# The hill's hollows: caverns below the barrow, joined by narrow winding tunnels that keep the
# archers' lines of fire short (#1835); small, 84×34 (about a third of the open caves' 100×40 in
# walkable cells, as tunnels leave more rock), so that a floor is a short crawl.
[[dungeon.levels]]
from = 3
to = 6
generator = { kind = "tunnels" }
size = [84, 34]
