# Fennmynster, "the fen minster" (docs/design/campaign.md §7.1; the fields: data/dungeons.toml):
# the cellars and crypts of the drowned minster in Micelfenn, the second of the Ascmearc's first
# dungeons. Its way in on the overworld is hidden until a quest reveals it. Eight levels of
# cellars and crypts built to a church's plan (the minster generator, docs/dev/mapgen.md "The
# minster"), drowning and falling to ruin deeper down, and the sunken crypt at the bottom.

[[dungeon]]
id = "fennmynster"
name = "Fennmynster"
arrival = "The water is up to the third step."
depth = 8

[dungeon.level]
generator = { kind = "minster" }
size = [100, 40]
traps = ["pit", "frost", "alarm", "teleport"]
# The monks hid their stores: more secret doors than the other dungeons, and hidden things and
# locks harder by more than half the floor's danger.
secret_doors = [1, 3]
hidden_danger_percent = 60
locks_danger_percent = 60
# A floor is about three times a rooms floor of 80x21: so is its loot.
loot = [5, 10]
purse = { gems = { chance = 38 } }
key = "iron_key"
# The marsh is mild: its water freezes nowhere.
temperature = 6
# Danger 3 on the first floor to 10 on the eighth (squished from 4 to 11,
# #534); nothing scales with the player. The fen wave: the marsh's beasts and things, the
# minster's drowned dead, and the cult that came to them (the bog hag, unique, comes once a run).
# Its types of level 11 (the fen ghoul, the wraith, the bog hag) come only out of depth, at the
# bottom. Fey of damp and dark places (#452) haunt its cellars too: the pixie, the boggle, and the
# darkling, each of either court. The drowned church's candlesticks, books, and lanterns stir too
# (#483: animated objects).
# Under the fen: bog iron and nothing else (#1389, data/mining.toml).
ores = ["iron"]
danger = 3
population = [
    "corpse_candle", "giant_leech", "giant_frog", "pixie", "drowned", "crocodile", "cultist",
    "cult_chymist",
    "lesser_water_elemental", "poltergeist", "will_o_wisp", "boggle", "ghast", "ghost", "shadow",
    "mud_golem", "cult_priest", "darkling", "marsh_troll", "bog_body", "wraith", "fen_ghoul",
    "bog_hag",
    "animated_candlestick", "animated_book", "animated_lantern", "animated_rug",
    # The rosters placed (#531): more fey of the damp, the motes and the lesser ice
    # elemental of the cold water, and the minster's dead in their stones and crypts: the stone
    # haunt, the pale drinker, and the mummy. (The redcap, level 12, waits for deeper places.)
    "sprite", "quickling", "satyr",
    "water_mote", "frost_mote", "lesser_ice_elemental",
    "stone_haunt", "pale_drinker", "mummy",
]
# How many: 20 a thousand walkable cells, 25 to 80. A minster floor has about 2,000 walkable
# cells (the old rooms floors 350 to 700, which got the least, 25): the default 35 would put 70
# on it, and its long open hall would bring them all at once; 20 puts about 40.
population_count = { per_1000 = 20, least = 25, most = 80 }

# The fen seeps in: a room is special one time in four, at most two a
# level; water, hush, and shadow most of the time, the dead often, and the rest whatever any
# dungeon may hold. Never a sweltering chamber, nor a forge.
room_effects = { chance = 25, per_level = 2, favoured = { flooded = 35, cursed = 15, hushed = 15, shadowed = 15 }, banned = ["forge", "hot"] }
# No one trades in the drowned minster.
shops = { chance = 0 }

# The lower cellars (docs/design/monster-dread.md §8): the dread come oftener the deeper the
# water stands, one draw in 75 here, one in 50 at the bottom (the default is one in 100).
[[dungeon.levels]]
from = 6
to = 7
dread_one_in = 75

# The bottom: the sunken crypt, where the minster kept what the water keeps now.
[[dungeon.levels]]
from = 8
vaults = ["sunken_crypt"]
dread_one_in = 50
