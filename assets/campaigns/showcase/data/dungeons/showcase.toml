# The showcase's dungeon branch, the Depths (the fields: data/dungeons.toml).

[[dungeon]]
id = "depths"
name = "the Depths"
depth = 8

[dungeon.level]
generator = { kind = "rooms" }
size = [80, 21]
creatures = ["rat", "bat", "kobold"]
traps = ["arrow", "arrow", "spear", "spear", "pit", "pit", "alarm", "teleport", "fireball", "frost", "lightning_bolt"]
# A secret door or two on each rooms level, and everything hidden harder to find the more
# dangerous the floor.
secret_doors = [1, 2]
hidden_danger_percent = 90
# Locks harder to pick there too (14 on the first level, danger 1, and 21 on the eighth).
locks_danger_percent = 90
# Loot on the floor of each level, at the floor's danger: 1 on the first, one more a level down.
loot = [2, 4]
danger = 1
# Only its patrols live there: nothing is drawn by the danger, and nothing comes back.
population_count = 0
spawn = { chance = 0 }
key = "rusty_key"
# Cool, as cellars are, and colder deeper down (never freezing).
temperature = 10

# Depths 3 to 5 are caverns.
[[dungeon.levels]]
from = 3
to = 5
generator = { kind = "caves" }
size = [120, 60]
temperature = 8

[[dungeon.levels]]
from = 6
to = 8
temperature = 6
