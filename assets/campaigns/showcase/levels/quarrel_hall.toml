# climbs to the storm-caller's top, the east stair to the maker's.
name = "The Quarrel Hall"
ambient = [200, 200, 200, 0]
map = '''
###########
#.........#
#.1.....2.#
#.........#
#...@O....#
#.........#
###########
'''

