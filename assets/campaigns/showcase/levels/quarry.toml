# The quarry (M19): an old stone quarry under the hub, down the stairs
# nook's `Q`. The place to dig, outside the safe showcase (nothing lives here, so nothing stops
# a dig but you).
#
# West: the arrival room, with the stairs (<) back up to the hub, a pick-axe beside where you
# start and a mattock below it. Ready one in the Tool slot (`e`), then dig with `U` and a
# direction: digging goes on turn after turn until the wall gives way.
#
# East: the quarry pit, lit by wall torches (t). Its north face is granite (G): half an hour of
# work with a pick-axe at Strength 10. Its south side is a bank of packed earth (E): a minute.
# A block of stone (#) stands in the pit, and old digging left rubble (,) about; a cut runs into
# the granite. Beyond the pit's east wall lies a sealed chamber with a lamp and a little treasure:
# no door leads in, so dig through the wall (six minutes with a pick-axe), and its light spills
# into the pit. Rock (spaces) bared by a dig shows as stone walls; the level's edge never breaks.
# The pit's old workings have flooded: a pool of deep water (w) in its south-east, for one trained
# in Swim to dive into (Swim), asked first every time.
arrival = "Chisel marks score the walls of the old quarry."
name = "The Quarry"
ambient = [0, 0, 0, 0]
map = '''
################################################################
#                                                              #
#              GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG                 #
# #############GGGGGGGG,GGGGGGGGGGGGGGGGGGGGGG                 #
# #.........t.##....t.,,,.......t.........t..#                 #
# #.l.........##......,......................#                 #
# #...........##.............................###########       #
# #...........##.............................#.........#       #
# #..<..@....................................#......l..#       #
# #...........##...........###......wwwwwww..#.........#       #
# #...........##...........###.,....wwwwwww..#.........#       #
# #...........##...........###,.....wwwwwww..###########       #
# #...........##....................,,.......#                 #
# ##############........t.............,.t....#                 #
#              EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE                 #
#              EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE                 #
#              EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE                 #
#                                                              #
#                                                              #
#                                                              #
################################################################
'''

[legend]
"@" = { terrain = "floor", spawn = "player" }
"<" = { terrain = "stairs_up", to = "hub" }
"G" = "granite"
"E" = "packed_earth"
"," = "rubble"
"t" = "sconce"
"w" = "deep_water"
"l" = { terrain = "floor", light = "lamp" }

# The tools: a pick-axe beside the start, a mattock below it.
[[pile]]
at = [9, 8]
objects = ["pick_axe"]

[[pile]]
at = [9, 10]
objects = ["mattock"]

# A unique dagger an old stonecutter left, west of the start.
[[pile]]
at = [7, 8]
objects = ["unique:stonebiter"]

# The three uniques of the drop pool (#1976), placed nowhere else: so tests and
# captures can reach them. The Grandmother, Silverstrike (with arrows to shoot), and the
# Radiant, whose light fills the dark arrival room once wielded.
[[pile]]
at = [5, 11]
objects = ["unique:grandmother"]

[[pile]]
at = [7, 11]
objects = ["unique:silverstrike", "arrow*20"]

[[pile]]
at = [9, 11]
objects = ["unique:radiant"]

# Two more of the pool (#2095, #2097): Demonsoul, a shield that breathes fire, and Deep Night, a
# cloak that puts out the lights about its wearer.
[[pile]]
at = [11, 11]
objects = ["unique:demonsoul"]

[[pile]]
at = [11, 9]
objects = ["unique:deep_night"]

# The Cracked Resurrection Stone (#2098), for the same pool: a cursed ring that undoes deaths.
[[pile]]
at = [11, 10]
objects = ["unique:cracked_resurrection_stone"]

# Stones from the old digging, to throw.
[[pile]]
at = [23, 4]
objects = ["rock*4"]

# The Masterpiece (#2100), a unique of the drop pool, placed nowhere else: in the arrival
# room's south-west corner, so tests and captures can reach it.
[[pile]]
at = [3, 12]
objects = ["unique:masterpiece"]

# What the sealed chamber keeps.
[[pile]]
at = [48, 8]
objects = ["gem:ruby*3", "gold_coin*25"]
