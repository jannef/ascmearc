# The clearing (#1781, docs/dev/towers.md): a forest clearing with a two-storey test tower in it,
# the showcase of the wizards' towers' machinery. The tower (W, 15×9) is a roofed building of
# tower wall, tower floor, and windows (=): from outside, the windows show the hall; from inside,
# the forest around. The hall is the ground floor: dark but for two wall torches, with the stair
# up (`<`, where the `tower` scenario starts) in its north bay and the door (+) in the south wall,
# where a track leads off into the wood. Everything is dressed stone without `hardness`: nothing
# digs or blasts through the shell.
#
# The upper floor (`tower_top`, `below = "clearing"`) stands over the same cells: from its windows
# the air cells show this level, so the deer (d) grazing west of the tower, the hare (r) east of
# it, and the dagger (!) in the grass are seen from above, as they stand. Looking down writes
# this level's memory (`cargo dev-cli dump --scenario tower --actions "ascend descend" --layers
# memory`).
