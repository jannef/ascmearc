# The test tower's clearing (#1783): the ground floor of a tower branch (`kind = "tower"`,
# data/dungeons/tower_climb.toml; docs/dev/mapgen.md "Towers"). A meadow with the tower standing
# in it: the box of its walls (W, its windows |, its door +) is the footprint every floor above
# is built on, and its `<` (inside, at the far end of the hall) climbs to the branch's first floor.
# The `tower_climb` scenario starts on the path west of the door.
#
# The tower is dressed stone (docs/dev/towers.md): tower walls no pick breaks, a tower floor,
# both roofed, and unglazed windows sight passes through.
name = "The Tower Meadow"
kind = "outdoor"
map = '''
................................................
................................................
..T.....................................T.......
.........T......................................
..............WWW|WW|WW|WW|WW|WW|W..............
..............WpppppppppppppppppsW..............
.......T......WppppppppppppppppppW...........T..
..............|pppppppppppppppppp|..............
..............WppppppppppppppppppW..T...........
:::@::::::::::+ppppppppppppppppppW..............
..............|pppppppppppppppppp|..............
..............WppppppppppppppppppW..............
..............WppppppppppppppppppW.........T....
....T.........|pppppppppppppppp<p|..............
..............WspppppppppppppppppW.....T........
......T.......WWW|WW|WW|WW|WW|WW|W..............
................................................
..........T...........................T.........
................................................
................................................
'''

[legend]
"." = "grass"
"T" = "tree"
":" = "flagstones"
"W" = "tower_wall"
"|" = "window"
"+" = "door_closed"
"p" = "tower_floor"
"s" = "sconce"
"<" = { terrain = "stairs_up", to = "tower_climb_floors:1" }
"@" = { terrain = "flagstones", spawn = "player" }
