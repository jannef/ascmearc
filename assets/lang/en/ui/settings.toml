# The settings module's words (`crates/ascmearc/src/settings/`): the commands' names and the
# contexts' titles that Controls and `?` show, the palette, clock and temperature settings, the
# rest prompt's choices, why a key cannot be bound, and what exporting and importing a keymap
# reports. Ids alphabetical. The ids of the settings file (`wait`, `high-contrast`) are not
# words and are not here.

# The clock setting's two forms.
[clock_12h]
text = "12-hour (AM/PM)"

[clock_24h]
text = "24-hour"

# A time of day on the 12-hour clock: `time`, the hour and minutes ("2:32").
[clock_am]
text = "{time:bare} AM"

[clock_pm]
text = "{time:bare} PM"

