text = "{degrees:bare} °C"

[degrees_fahrenheit]
text = "{degrees:bare} °F"

# Why a key cannot be bound: it is fixed where the command is read. `shown`, the key.
[fixed_in_aim]
text = "{shown:bare} is fixed in aiming"

[fixed_in_menu]
text = "{shown:bare} is fixed in menus and screens"

[fixed_in_pages]
text = "{shown:bare} is fixed in info pages"

[fixed_in_text]
text = "{shown:bare} is fixed in text fields"

# What importing a keymap skipped or moved, a line each (the first shows in Controls). `shown`, a
# key; `name`, the command the file lists; `owner`, the command that had the key.
[import_keyless]
text = "{owner:bare} has no key now ({shown:bare} went to {name:bare})"

[import_listed_for_both]
text = "{shown:bare} is listed for both {owner:bare} and {name:bare}; kept for {owner:bare}"

# `version`, the file's format version.
[import_newer]
text = "written by a newer Ascmearc (version {version:bare}); read as far as this one knows"

# `place`, where the file lists the command ("[play] wait", as written in the file).
[import_no_usable]
text = "{place:bare}: no usable keys; left as it was"

# `name`, a table or value in the file that is neither.
[import_not_command]
text = "`{name:bare}` is not a context or a command; skipped"

# `item`, the value in the file.
[import_not_key]
text = "{place:bare}: {item:bare} is no key that can be bound"

# The file is no TOML: `error`, what the reader said.
[import_not_keymap]
text = "not a keymap: {error:bare}"

[import_not_list]
text = "{place:bare}: expected a list of keys; skipped"

# The summary's line of problems: `problem`, the first; `more`, how many others. A translation
# keeps the `!`, which marks a refusal.
[import_problem]
text = "! {problem:bare}"

[import_problems]
text = "! {problem:bare} (and {more:bare} more)"

# `why`, the reason the key cannot be bound (`fixed_in_*`, `kept_by_*`, `plain_keys_only`).
[import_refused]
text = "{place:bare}: {why:bare}; skipped"

[import_twice]
text = "{place:bare}: listed twice; the first kept"

[import_unknown_command]
text = "{place:bare}: unknown command; skipped"

# `value`, what the file has as its version.
[import_version]
text = "version {value:bare} is not a number; read as the current one"

# What importing did: `source`, the file (or "the keymap" from the browser); `name`, the one
# command changed; `count`, how many changed.
[imported_many]
text = "Imported {source:bare}: keys of {count:bare} commands changed."

[imported_none]
text = "Imported {source:bare}: no keys changed."

[imported_one]
text = "Imported {source:bare}: {name:bare} changed."

# A shortcut the system or the browser keeps, so it never reaches the game: `shown`, the key.
[kept_by_browser]
text = "{shown:bare} is kept by the browser"

[kept_by_macos]
text = "{shown:bare} is kept by macOS"

[kept_by_system]
text = "{shown:bare} is kept by the system"

# Export keys and Import keys: `path`, the file; `file`, the download's name; `error`, what
# the system said.
[keymap_cannot_read]
text = "Could not read {path:bare}: {error:bare}"

[keymap_cannot_write]
text = "Could not write {path:bare}: {error:bare}"

[keymap_downloaded]
text = "Keys saved as {file:bare}."

[keymap_exported]
text = "Keys exported to {path:bare}."

[keymap_missing]
text = "No keymap at {path:bare}: export one first, or put one there."

[keymap_not_stored]
text = "Keys are not stored in this launch."

# The command line's `--import-keys FILE` and `--export-keys FILE`: `path`, the file; `place`,
# the settings file; `error`, what went wrong.
[keys_cannot_read]
text = "cannot read {path:bare}: {error:bare}"

[keys_cannot_write]
text = "cannot write {path:bare}: {error:bare}"

[keys_in_file]
text = "{path:bare}: {error:bare}"

[keys_not_saved]
text = "Not saved: settings are not stored in this launch."

[keys_saved]
text = "Saved in {place:bare}."

[keys_wrote]
text = "Wrote the keymap to {path:bare}."

# The color palettes.
[palette_colorblind]
text = "Colorblind (red-green)"

[palette_default]
text = "Default"

[palette_high_contrast]
text = "High contrast"

# A key with modifiers for a command outside play: `name`, the command. The modifier names are
# keys: keep them.
[plain_keys_only]
text = "{name:bare} takes plain keys only: Ctrl, Alt, and Super are for keys in play"

# The rest prompt's choices. Its key (h, d, n) is marked where a word starts with it ("until
# (d)awn"), else shown after the words: a translation keeps the keys.
[rest_dawn]
text = "until dawn"

[rest_hour]
text = "hour"

[rest_nightfall]
text = "until nightfall"

# The temperature unit setting.
[unit_celsius]
text = "°C (Celsius)"

[unit_fahrenheit]
text = "°F (Fahrenheit)"
