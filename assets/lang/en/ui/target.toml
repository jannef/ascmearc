# Targeting (`crates/ascmearc/src/ui/target.rs`): the prompt in the message line while aiming, and
# why the aimed line falls short. Ids alphabetical.
#
# The keys named are fixed or as bound (`next`, Tab; `loose`, Enter; `confirm`, the key that
# started the aim): translate the words around them. The message line cuts a text longer than
# the console (docs/dev/localization.md "UI text").

# Why a missile loosed along the aimed line would not reach the cursor, said after what the
# cursor is on.
[blocked]
text = "The way is blocked."

[no_corpse]
text = "There is no corpse there."

[out_of_range]
text = "Out of range."

# The prompts, one per way of aiming: `ready`, what is aimed ("a flaming arrow"; an ability's
# name); `next`, the key that cycles targets; `loose`, the fixed key that looses; `confirm`, the
# key that started the aim, as bound.
[prompt_ability]
text = "{ready:bare}: {next:bare} or direction keys aim, {loose:bare} or {confirm:bare} uses it, Esc cancels."

[prompt_exploit]
text = "Exploit an opening with {ready:bare}: {next:bare} or direction keys aim, {loose:bare} or {confirm:bare} throws, Esc cancels."

[prompt_fire]
text = "Fire {ready:bare}: {next:bare} or direction keys aim, {loose:bare} or {confirm:bare} fires, Esc cancels."

[prompt_read]
text = "Read {ready:bare}: {next:bare} or direction keys aim, {loose:bare} or {confirm:bare} reads, Esc cancels."

[prompt_throw]
text = "Throw {ready:bare}: {next:bare} or direction keys aim, {loose:bare} or {confirm:bare} throws, Esc cancels."

[prompt_zap]
text = "Zap {ready:bare}: {next:bare} or direction keys aim, {loose:bare} or {confirm:bare} zaps, Esc cancels."

[unseen]
text = "You do not see there."
