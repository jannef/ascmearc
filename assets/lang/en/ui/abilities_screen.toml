# The abilities menu (`crates/ascmearc/src/ui/abilities_screen.rs`). Ids alphabetical.
#
# The keys named in the hint lines are fixed (`a`, `Enter`, `Esc`): translate the words around
# them. The screen fits each text to its panel: a translation longer than the room is cut with
# `…`, which the screen snapshots check (docs/dev/localization.md "UI text").

# What an ability asks for, when it can be used now.
[aim_ailment]
text = "on yourself or an ally"

[aim_cell]
text = "at a place you see"

[aim_corpse]
text = "at a corpse you see"

[aim_direction]
text = "in a direction"

[aim_item]
text = "on something you carry"

[aim_rig]
text = "a trap beside you"

[aim_shape]
text = "in a weapon's shape"

[aim_spell]
text = "a scroll of a spell you know"

[aim_throw]
text = "something thrown at a place you see"

# A spell that can be used now and is cast at a place. `cost`: what it rolls and costs
# (`mana`, `roll_mana`).
[aimed]
text = "{cost:bare}, aimed"

# Charge's stamina: `base` for the charge, `per` for each pace run.
[charge_stamina]
text = "{base:bare} stamina + {per:bare} a pace"

[close]
text = "Esc close"

# The footer's way out with no ability listed: `own`, the key that opens the menu.
[close_own]
text = "{own:bare} or Esc close"

# A row's state when it can be used now: `cost`, what it costs; `aim`, what it asks for (`aim_*`).
[cost_aim]
text = "{cost:bare}, {aim:bare}"

# A row's state when it cannot be used now: `cost`, what it costs; `why`, why not.
[cost_why]
text = "{cost:bare}: {why:bare}"

# A spell that rolls nothing: `cost`, its mana.
[mana]
text = "{cost:bare} mana"

[none]
text = "You have no abilities."

# Why the ability just chosen cannot be used: `ability`, its name; `why`, the reason.
[notice]
text = "{ability:bare}: {why:bare}."

# A spell's reach now, after its description: `reach`, "range 11, radius 2".
[reach]
text = "{reach:Bare}."

# A spell's roll and cost: `roll`, the dice and their type ("4d6 fire"); `cost`, its mana.
[roll_mana]
text = "{roll:bare}, {cost:bare} mana"

# A spell the player is short of mana for: `cost`, what it rolls and costs; `mana`, what they have.
[short_of_mana]
text = "{cost:bare}: you have {mana:bare}"

# An active weapon ability's stamina.
[stamina]
text = "{stamina:bare} stamina"

[title]
text = "Abilities"

# The footer's letters to use: `confirm`, the key that uses the `>` row.
[use_a]
text = "a or {confirm:bare} use"

# The same, for the letters `a` to `last`.
[use_letters]
text = "a-{last:bare} or {confirm:bare} use"
