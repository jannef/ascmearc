# The Skills screen (`crates/ascmearc/src/ui/skills_screen.rs`). Ids alphabetical.
#
# The skills' names and descriptions come from the game's data. The keys named in the footer are
# fixed (`Esc`): translate the words around them. The screen fits each text to its panel
# (docs/dev/localization.md "UI text").

# The footer's parts: `keys`, the keys that move the selection; `own`, the screen's own key, as
# bound.
[choose]
text = "{keys:bare} choose"

[close]
text = "Esc close"

[close_own]
text = "{own:bare} or Esc close"

# The list has no rows.
[none]
text = "You are not trained in any skill."

[title]
text = "Skills"
