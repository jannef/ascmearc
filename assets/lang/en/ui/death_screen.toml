# The death screen (`crates/ascmearc/src/ui/death_screen.rs`). Ids alphabetical.
#
# The epitaph is lines the screen centres: each is one line of it, in the order read. The screen
# fits each text to its panel (docs/dev/localization.md "UI text").

# The date of death in the epitaph's `date`: `day`, the day of the month; `month`, its name
# (`calendar:months.<n>`, a line of data); `year`.
[date]
text = "{day:bare} {month:bare}, Year {year:bare}"

# The cause, a status without words of its own: `status`, by its name (`status:<id>`).
[died_of]
text = "Died of {status:bare}"

# The footer: `confirm`, the key that leaves.
[footer]
text = "{confirm:bare} or Esc  main menu"

# The epitaph's lines: `name`, the titled name; `class`, the class (`class:<id>`) and
# `prestige`, the prestige class once called (`prestige:<id>`); `by`, the cause; `place`; `date`
# and `time`; `n`, turns; `level`.
[epitaph_by]
text = "{by:bare},"

[epitaph_class]
text = "{class:a},"

[epitaph_class_prestige]
text = "{class:a} and {prestige:bare},"

[epitaph_here_lies]
text = "Here lies {name:bare},"

[epitaph_level]
text = "You had reached level {level:bare}."

[epitaph_place]
text = "in {place:bare},"

[epitaph_turns]
by = "n.number"
one = "after 1 turn."
many = "after {n:bare} turns."

[epitaph_when]
text = "on {date:bare}, at {time:bare},"

# The cause: `who`, the creature as a phrase; the language gives its article.
[killed_by]
text = "Killed by {who:a}"

[killed_unseen]
text = "Killed by something you did not see"

[nothing]
text = "Nothing has died."

[remembered]
text = "Remembered in the graveyard."

[run_over]
text = "Your run is over; its save is gone."

[title]
text = "Y O U   D I E D"
