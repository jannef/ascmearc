# Settings > Files (`crates/ascmearc/src/ui/files_screen.rs`). Ids alphabetical. The kinds of
# file, what they hold, and why they are where they are come from `paths.rs`.
#
# The keys named in the footer are fixed (`Esc`): translate the words around them. The screen
# wraps each text to its panel (docs/dev/localization.md "UI text").

[back]
text = "Back"

# On the web, under the mode line: where the files are instead.
[browser]
text = "Settings and the saved run are kept under ascmearc/ keys in local storage. They survive reloads; clearing this site's data erases them. There are no folders to open."

# `up_down`, the keys that select a row; `confirm`, the key that opens its folder.
[footer]
text = "{up_down:bare} select   {confirm:bare} open folder   Esc back"

# The footer with nothing to open (the web).
[footer_back]
text = "Esc back"

# A kind's place when it is kept nowhere.
[not_stored]
text = "(not stored)"

# A kind of file kept nowhere this launch: `label`, the kind, as the list names it.
[nowhere]
text = "{label:bare} is not stored anywhere."

# The folder was opened: `folder`, its path.
[opened]
text = "Opened {folder:bare}."

[title]
text = "Where are my files?"
