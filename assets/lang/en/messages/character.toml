# The character (`world/character/`): experience and levels, talents and skill rolls, stats
# trained and wasted, the birth sign's gifts and breaths, the racial actives, the ratfolk craving,
# profane gifts, the laws, and the dev actions that grant these. Ids alphabetical
# (`docs/dev/localization.md` "Literal lines"). The lines the data writes (an alignment band's
# `rise` and `fall`, the craving's and the oaths' messages, the laws' `first`, a profane gift's
# `line`, `undone`, and `instead`, cold blood's bands) are lines of data, said by their keys
# (`content/data_line.rs`).
#
# Roles: `who` is a creature a line is about, as the player calls it ("the kobold", "Grimbold").
# `status` is a status by its name (`status:<id>`, "invisible"), `skill` a skill's
# (`skill:<id>`), and `name` a resource's (`resource:<id>`); `talent` and `gift` are a talent's
# and a profane gift's names (`talent:<id>`, with what was chosen for it `talent_chosen`), and
# `trees` and `talents` lists of them (`tree:<id>`); `reason` is why an ability cannot be used, a
# message of its own (`messages/ability.toml`). `id`
# is an id a dev action was given, as typed. `xp`, `level`, and `value` are numbers, said in
# digits.

at_whom = "At whom?"
