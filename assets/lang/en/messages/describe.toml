# `n` of `what`, a stack of several.
base_count = "{n:bare} {what:bare}"
# `rarity`: its rarity's word; `what`, the item.
base_rarity = "{rarity:Bare} {what:bare}"
# `n`: a chance in percent.
breaks = "Breaks on a hit {n:bare}% of the time"
