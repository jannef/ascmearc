# An item's description (`magic/describe.rs`): the describe screen's lines and the wiki's, a line
# each: what it is and its gems, its base stats, its numbers, an affix's effect (`does_*`, also
# the enchanting choice's and the wiki's), a grimoire's, a wand's, a rod's, and a potion's lines,
# what it can bear, its maker's mark, and what the Eye for the make reads of it (`make_*`). Ids
# alphabetical (`docs/dev/localization.md` "Literal lines"), the plain ones first, then the
# tables. A unique item's power and lore and a spirit weapon's power are the data's, said as
# literal lines.
#
# Roles: `what` is the item (a phrase, or a message of it); `n` and `v` numbers (an affix's value
# `v`, said after a sign the template writes: "+{v:bare}"); `dice`, `critical`, `weight`, `made`,
# `hit`, a crystal's `colour` and a family's `word`, and a part's or a weapon's name (`part`,
# `noun`) are notation or the data's English, text until they are converted (#1949); `about` is a
# spell's or a rod effect's description and `effect` a rod effect's name (the data's, text);
# `spell` a spell by its name (`spell:<id>`, said `Bare` as the data writes it, "Fireball");
# `kind` a damage type (`damage_type:<id>`, or `some_kind`); `slot` an equipment slot
# (`slot:<id>`, lower case); `status` a status (`status:<id>`); `stat` a stat's name or
# comparative (`words.toml`); `skill` a skill (`skill:<id>`); `pool` a resource (`resource:<id>`,
# or `a_pool`); `bane` a creature tag (`tag:<tag>`, said `plural`); `affix` an affix by its name
# (`affix:<id>`); `does`, `speed`, `place`, `hard`, `rarity`, and `line` messages of their own;
# `kinds`, `cures`, `raised`, `against`, `from`, and `parts` lists (a list, or a `listed`,
# `and_joined`, or `or_joined` message).

# `pool`: a resource the affix names none of.
a_pool = "a pool"
# `dice`, the dice; `kind`, a damage type.
adds = "Adds {dice:bare} {kind:bare} damage"
# `affix`: the affix; `does`, what it does (a `does_*` message).
affix = "{affix:bare}: {does:bare}"
# `noun`: the weapon's kind ("bow"), text; `ammo`, what it shoots (`object:<id>`, said
# `plural`, or `ammunition`).
ammo_launcher = "{noun:Bare}, readied as a missile weapon; shoots {ammo:plural}"
# `from`: the launchers' kinds, each a `word:` phrase of several (an `and_joined`, or one).
ammo_quivered = "Ammunition, quivered; shot from {from:bare}"
# What a launcher shoots when no ammunition of its kind exists.
ammunition = "ammunition"
# Two or more said with "and": `first`, one; `rest`, the others (this entry again, or the last).
