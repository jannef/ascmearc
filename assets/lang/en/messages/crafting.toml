# Crafting (`world/crafting/`): making a recipe, cutting gems, enchanting, crystals, digging, and
# the field forge. Ids alphabetical (`docs/dev/localization.md` "Literal lines"), the plain ones
# first, then the tables. A profession's `failed` and `fumbled` lines are the data's, said by
# their keys (`docs/dev/localization.md` "Lines of data").
#
# Roles: `what` is a thing (a phrase built where it is said); `item` the item being enchanted;
# `stone` the crystal it takes; `title` what it wakes as (a rare's name, else the item); `gem` a
# gem, as a stack or as its material; `crystal` a crystal by its object; `wall` and `station` a
# terrain; `affix` an affix by its name ("Sharp", "of the Bear"); `magic` an item's magic as a
# salvage line names it (`its_magic_suffix`, `its_prefix_magic`, `some_of_its_magic`); `count` a
# number. `skill`, `recipe`, `launcher`, and `part` are core's and the data's English words, text
# until they are converted (#1949); `time` how long a work went on ("3 minutes"); `came` the clause
# that says what stopped it ("A kobold comes into view").

