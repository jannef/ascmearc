# Magic (`world/magic/`): casting a spell, its heals, hexes, and cleanses, blood magic, miscasts and
# backfires, ruin, restoration, wands, zones, and the dev actions that show an effect, lay a zone,
# or spend mana. Ids alphabetical (`docs/dev/localization.md` "Literal lines"), the plain ones
# first, then the tables. What the data writes (a spell's cast message, a miscast's and a
# mishap's message, a ruin row's words, a reprieve's message) is said by its key in the data, not
# here (`docs/dev/localization.md` "Lines of data").
#
# Roles: `who` is the creature a line is about, as the player calls it ("the kobold", "Snel");
# `what` an item (a phrase built where it is said); `status` a status as it looks ("dazed");
# `id`, `kind`, `usage`, `x`, `y` a dev action's words and numbers as typed. `reason` and `stat`
# are core's English words, text until they are converted.

# `what`: the item, one of the stack.
already_know = "You already know what {what:counted} is."
# A dev action's.
bolt_needs_a_way = "A bolt needs a way to go: `effect:ID@X,Y>X,Y`, not into a wall."
# `status`: the status that blocks the cast, its name lower case.
cannot_cast_while = "You are {status:bare}: you cannot cast now."
# `reason`: why the ability is unavailable (`Unavailable::reason`).
cannot_reason = "You cannot: {reason:bare}."
carry_no_such_thing = "You carry no such thing."
# `usage`: the action text that names the spell (`use:identify`, `read:c`).
cast_it_on_what = "Cast it on what? Name a stack you carry: `{usage:bare}:c`."
cast_it_where = "Cast it where? Name a cell: `{usage:bare}:12,5`."
cleansing_warmth = "A cleansing warmth runs through you."
driven_back = "{who:The} {who:is} driven back."
# A dev action's: `id` the effect's.
effect_dev = "Effect: {id:bare} (dev)."
effect_reaches_no_cell = "Effect `{id:bare}` reaches no cell there."
# `stat`: the stat's name, lower case ("strength").
feel_stat_return = "You feel your {stat:bare} return."
give_blood = "You give your blood, and power wells up in you."
healing_flows_into = "Your healing flows into {who:the}."
hex_comes_home = "The hex comes home."
# `status`: how the status looks ("asleep"), a `word:` phrase.
is_status = "{who:The} {who:is} {status:bare}."
# `what`: the wand's type, now known.
it_is = "It is {what:counted}."
looks_better = "{who:The} look{who:s} better."
mana_full = "Your mana is already full."
means_no_harm = "{who:The} mean{who:s} you no harm."
no_blood_magic = "You know no blood magic."
no_effect = "There is no effect `{id:bare}`."
no_one_here_hurt = "No one here is hurt."
no_one_to_hex = "You see no one there to hex."
no_one_to_touch = "There is no one there to touch."
no_such_ability = "You have no such ability."
# `who`: the one the heal was for, the player ("You are not hurt.") or another.
not_hurt = "{who:The} {who:is} not hurt."
nothing_happens = "Nothing happens."
nothing_to_burst = "There is nothing there to burst."
nothing_to_cure = "There is nothing to cure."
nothing_to_restore = "There is nothing to restore."
nowhere_to_go = "There is nowhere to go."
# A dev action's: `x` and `y` the cell's.
off_level_dev = "{x:bare},{y:bare} is off the level (dev)."
# A dev action's: `left` the mana the player has.
only_mana_dev = "You have only {left:bare} mana (dev)."
open_sky = "You need the open sky above you for that."
# A miscast's portal the level refuses (`pit.rs`), told to the player who miscast.
pit_refused_ground = "The ground heaves but will not open, and a gate tears through beside you instead!"
# The same of a creature the player sees: `who` the caster.
pit_refused_ground_seen = "The ground heaves beside {who:the}, and a gate tears through!"
pit_refused_in_pit = "The floor here is the Pit's already: a gate tears open beside you instead!"
pit_refused_in_pit_seen = "The floor heaves beside {who:the}, and a gate tears open!"
slip = "You slip on the slick ground!"
slips = "{who:The} slip{who:s}."
spell_takes_hold_of = "Your spell takes hold of {who:the} instead."
# A dev action's: `cost` the mana spent.
spend_mana_dev = "You spend {cost:bare} mana (dev)."
takes_mends_you = "What it takes mends you."
too_little_blood = "You have too little blood left to give."
too_little_mana = "You have too little mana."
touch_next_to_you = "You can only touch someone next to you."
wounds_close = "Your wounds close."
# `what`: the wand as the player knows it, its title ("oak wand").
zap = "You zap the {what:bare}."
# A dev action's: `kind` the zone's id, `x` and `y` its centre.
zone_dev = "A {kind:bare} zone lies around {x:bare},{y:bare} (dev)."

# A backfired summon: `who` the creatures that came, all of one type, with their count ("a
# kobold", "two kobolds").
[hostile_call]
by = "who.number"
one = "{who:A} comes to your call, but not to your side!"
many = "{who:Num} {who:plural} come to your call, but not to your side!"

# The same, of several types: `who` a list of `hostile_creatures` ("A kobold and two rats").
[hostile_call_mixed]
text = "{who:And} come to your call, but not to your side!"

# A creature's backfired summon the player sees: `caster` the creature that called.
[hostile_call_seen]
by = "who.number"
one = "{who:A} comes to {caster:poss} call, but not to its side!"
many = "{who:Num} {who:plural} come to {caster:poss} call, but not to its side!"

[hostile_call_seen_mixed]
text = "{who:And} come to {caster:poss} call, but not to its side!"

# An item of the `_mixed` lines' list: `who`, the creatures of one type that came ("a kobold",
# "two rats").
[hostile_creatures]
by = "who.number"
one = "{who:a}"
many = "{who:num} {who:plural}"

# Items an area spell ruined where the player saw them: `what` the items lost, with their count;
# `title` one of them by its title ("scroll labelled ZUNBAR"); `one` and `many` the ruin row's
# words for one and for several, `ruin:<row>.says.0` and `.says.1` ("burns up", "burn up").
[ruined]
by = "what.number"
one = "{title:The} {one:bare}."
many = "{what:Counted} {many:bare}."
