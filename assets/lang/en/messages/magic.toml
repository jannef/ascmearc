# A summon spell's allies: `who` the creatures that came, all of one type, with their count ("a
# wolf", "two wolves").
[comes_to_call]
by = "who.number"
one = "{who:A} comes to your call."
many = "{who:Num} {who:plural} come to your call."

# The same, of several types: `who` a list of `hostile_creatures` ("A wolf and two rats").
[comes_to_call_mixed]
text = "{who:And} come to your call."

# A backfired summon: `who` the creatures that came, all of one type, with their count ("a
# kobold", "two kobolds").
[hostile_call]
by = "who.number"
one = "{who:A} comes to your call, but not to your side!"
many = "{who:Num} {who:plural} come to your call, but not to your side!"

# The same, of several types: `who` a list of `hostile_creatures` ("A kobold and two rats").
[hostile_call_mixed]
text = "{who:And} come to your call, but not to your side!"

# A creature's backfired summon the player sees: `caster` the creature that called.
[hostile_call_seen]
by = "who.number"
one = "{who:A} comes to {caster:poss} call, but not to its side!"
many = "{who:Num} {who:plural} come to {caster:poss} call, but not to its side!"

[hostile_call_seen_mixed]
text = "{who:And} come to {caster:poss} call, but not to its side!"

# An item of the `_mixed` lines' list (`comes_to_call_mixed`'s too): `who`, the creatures of one
# type that came ("a kobold", "two rats").
[hostile_creatures]
by = "who.number"
one = "{who:a}"
many = "{who:num} {who:plural}"

# Items an area spell ruined where the player saw them: `what` the items lost, with their count;
# `title` one of them by its title ("scroll labelled ZUNBAR"); `one` and `many` the ruin row's
# words for one and for several, `ruin:<row>.says.0` and `.says.1` ("burns up", "burn up").
[ruined]
by = "what.number"
one = "{title:The} {one:bare}."
many = "{what:A} {many:bare}."
