# Magic (`world/magic/`): casting a spell, its heals, hexes, and cleanses, blood magic, miscasts and
# backfires, ruin, restoration, wands, zones, and the dev actions that show an effect, lay a zone,
# or spend mana; reading scrolls, studying grimoires, deciphering, scribing, forgetting, rods, and
# the summoning and corpse spells. Ids alphabetical (`docs/dev/localization.md` "Literal lines"),
# the plain ones first, then the tables. What the data writes (a spell's cast message, a miscast's
# and a mishap's message, a ruin row's words, a reprieve's message, a risen corpse's berserk line)
# is said by its key in the data, not here (`docs/dev/localization.md` "Lines of data").
#
# Roles: `who` is the creature a line is about, as the player calls it ("the kobold", "Snel");
# `what` an item (a phrase built where it is said); `status` a status as it looks ("dazed");
# `id`, `kind`, `usage`, `x`, `y` a dev action's words and numbers as typed. `stat` is a stat's
# name (`words.toml`); `reason` is why an ability cannot be used, a message of its own
# (`messages/ability.toml`), and `came` the clause that says what stopped a long action ("A kobold
# comes into view", `turn.comes_into_view`). `spell` and `spells` are a spell's name as the data
# writes it ("Frost"), text until they are converted.

# `what`: the item, one of the stack.
already_know = "You already know what {what:a} is."
# `what`: the grimoire, by its title ("grimoire of frost").
begin_to_read = "You begin to read {what:the}."
begin_to_write = "You begin to write."
blank_scroll_gone = "The blank scroll is gone."
# A dev action's.
bolt_needs_a_way = "A bolt needs a way to go: `effect:ID@X,Y>X,Y`, not into a wall."
bolt_strikes_nothing = "The bolt strikes nothing."
# `status`: the status that blocks the cast, by its name (`status:<id>`).
cannot_cast_while = "You are {status:bare}: you cannot cast now."
cannot_lead_more = "You cannot lead more than this."
cannot_make_sense = "You cannot make sense of it."
# `what`: the item, one of the stack, as the player knows it.
cannot_read = "You cannot read {what:a}."
# `reason`: why the ability is unavailable (`Unavailable::reason`).
cannot_reason = "You cannot: {reason:bare}."
# `status`: the status that blocks it, by its name (`status:<id>`).
cannot_use_rod_while = "You cannot use a rod while {status:bare}."
cannot_write_it = "You cannot write it."
cannot_zap_yourself = "You cannot zap at yourself."
carry_no_such_thing = "You carry no such thing."
# `usage`: the action text that names the spell (`use:identify`, `read:c`).
cast_it_on_what = "Cast it on what? Name a stack you carry: `{usage:bare}:c`."
cast_it_where = "Cast it where? Name a cell: `{usage:bare}:12,5`."
cleansing_warmth = "A cleansing warmth runs through you."
do_not_know_spell = "You do not know that spell."
# `what`: the corpse (its object).
draw_life_out_of = "You draw what life is left out of {what:the}."
driven_back = "{who:The} {who:is} driven back."
# A dev action's: `id` the effect's.
effect_dev = "Effect: {id:bare} (dev)."
effect_reaches_no_cell = "Effect `{id:bare}` reaches no cell there."
# `stat`: the stat's name ("strength").
feel_stat_return = "You feel your {stat:bare} return."
# `spells`: the spells forgotten, a list of their names.
forgotten = "You have forgotten {spells:and}."
# `xp`: the experience gained; `spell`: the spell's name.
gain_experience_for_learning = "You gain {xp:bare} experience for learning {spell:bare}."
give_blood = "You give your blood, and power wells up in you."
