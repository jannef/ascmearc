# Levels (`world/levels/`): travel between levels and on the overworld, stairs and the ones who
# follow, the overworld's encounters, deep water, ice, fire, webs, the Pits, and the dev actions
# that move the player or reshape a level. Ids alphabetical (`docs/dev/localization.md` "Literal
# lines"), the plain ones first, then the tables.
#
# Roles: `who` is the creature a line is about; `pack` the player's allies, a list ("Snel and your
# wolves"); `what` a thing or a terrain; `place` a place by its name ("Ceaptun", "the Barrow");
# `party` an encounter's party as its data names it, article and all ("a band of footpads");
# `fire` the burning terrain. `verb` is a damage type's verb and `seen` how a status looks
# ("caught in a web"), English words from the data, text until that data's text is converted.
# `error` is a refusal's reason, English for developers; `id` a level, location, or encounter id
# as typed; `x`, `y`, `cells`, `laid`, and `price` are numbers.

# A dev action's: `id` as typed.
already_on_dev = "You are on `{id:bare}` already."
answer_first = "You must answer first."
break_through_ice = "You break through the ice."
cannot_go = "You cannot go there ({error:bare})."
cannot_go_dev = "You cannot go there: {error:bare}."
cannot_go_that_way = "You can't go that way."
cannot_leave = "You cannot leave this way ({error:bare})."
cannot_swim = "You cannot swim."
climb_out_onto_ice = "You climb out onto the ice."
# `place`: the level's name.
climb_out_to = "You climb out to {place:bare}."
climb_to = "You climb the stairs to {place:bare}."
come_upon = "You come upon {party:bare}."
descend_to = "You descend the stairs to {place:bare}."
dive_in = "You dive into the deep water."
enemies_about = "You cannot slip away with enemies about."
enter_place = "You enter {place:bare}."
# `what`: the terrain of the overworld cell ("forest").
explore = "You explore {what:the}."
# `fire`: the burning terrain; `who`: the creature it burns; `verb`: how the damage type says it
# ("burns").
fire_burns = "{fire:The} {verb:bare} {who:a}."
fire_burns_you = "{fire:The} {verb:bare} you!"
fire_harmless = "{fire:The} flare{fire:s} about you harmlessly."
foot_finds_no_bottom = "Your foot finds no bottom: deep water lies ahead."
# A dev action's: `x`, `y` the centre, `cells` how many froze.
frost_dev = "Frost seizes the water around {x:bare},{y:bare} ({cells:bare} cells, dev)."
go_after = "You go after {party:bare}."
go_to_meet = "You go to meet {party:bare}."
go_under = "You go under and choke."
ice_creaks = "The ice creaks under your weight."
keep_your_head = "You keep your head, and the cold bites less deep."
known = "You remember them: you got away from them here before."
# `boss`: the layer boss slain.
lair_opens = "With {boss:the} dead, stairs open in the floor."
# `what`: the player's light, theirs.
light_goes_out = "{what:The} go{what:es} out."
lose_them_byways = "You lose them in the byways."
lose_them_grass = "You lose them in the long grass."
lose_them_hills = "You lose them in the hills."
lose_them_marsh = "You lose them in the marsh."
lose_them_woods = "You lose them in the woods."
# `place`: the hidden location found on the way out.
mark_found = "You mark {place:bare} on your map."
