# `who`: the creatures that followed, all of one type ("the kobold", "three kobolds").
[follow_down]
by = "who.number"
one = "{who:The} follows you down the stairs."
many = "{who:Num} {who:plural} follow you down the stairs."

# `who`: the creatures that followed, of several types, a list.
[follow_down_mixed]
text = "{who:Counted} follow you down the stairs."

[follow_up]
by = "who.number"
one = "{who:The} follows you up the stairs."
many = "{who:Num} {who:plural} follow you up the stairs."

[follow_up_mixed]
text = "{who:Counted} follow you up the stairs."

# `what`: what sank: a stack, a list of two or three, or a count of objects.
[sinks]
by = "what.number"
one = "{what:Counted} sinks into the water."
many = "{what:Counted} sink into the water."
