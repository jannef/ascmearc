# The fixed words core picks from a few (#1996): a stat's name, abbreviation, and comparative, a
# burden's and a hunger's name, how hurt a creature looks, a span of time, a resistance, an item's
# rarity, what a status keeps one from doing, a gender, an alignment band, the weather, a compass
# direction, and the weapon skills screen's sections. Core passes them as message ids
# (`Stat::name`, `Burden::name`, `Hunger::name`, `Health::word`, `Duration::spoken`,
# `ResistanceWord::word`, `Rarity::word`, `ActionKind::doing`, `Gender::name`, `Band::name`,
# `Weather::name`, `Dir::compass_word`, `Section::name`), nested in the line or the screen entry
# that says them (`docs/dev/localization.md` "Nested messages"). A word is lower case, as it stands
# in a sentence; a label asks `Bare` for its capital ("Strength", "Not hungry"). Ids alphabetical
# (`docs/dev/localization.md` "Literal lines").
#
# Roles: `burden` is a burden's name, `weight` a weight in words ("15 kg"); `hours` and `minutes`
# are spans of time, each a `hours`/`minutes` message; `mark` a slot's mark; `n` a count.

