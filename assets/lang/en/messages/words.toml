# The fixed words core picks from a few (#1996): a stat's name, abbreviation, and comparative, a
# burden's and a hunger's name, how hurt a creature looks, and a span of time. Core passes them as
# message ids (`Stat::name`, `Burden::name`, `Hunger::name`, `Health::word`, `Duration::spoken`),
# nested in the line or the screen entry that says them (`docs/dev/localization.md` "Nested
# messages"). A word is lower case, as it stands in a sentence; a label asks `Bare` for its capital
# ("Strength", "Not hungry"). Ids alphabetical (`docs/dev/localization.md` "Literal lines").
#
# Roles: `burden` is a burden's name, `weight` a weight in words ("15 kg"); `hours` and `minutes`
# are spans of time, each a `hours`/`minutes` message; `n` a count.

burden_burdened = "burdened"
# A burden's threshold (the character screen): `burden`, the burden past it; `weight`, the weight.
burden_over = "{burden:bare} over {weight:bare}"
burden_overloaded = "overloaded"
burden_strained = "strained"
burden_unburdened = "unburdened"
health_badly_wounded = "badly wounded"
health_lightly_wounded = "lightly wounded"
health_nearly_dead = "nearly dead"
health_unhurt = "unhurt"
health_wounded = "wounded"
# Hours and minutes together, each its own message ("2 hours and 30 minutes").
hours_and_minutes = "{hours:bare} and {minutes:bare}"
hunger_bloated = "bloated"
hunger_fainting = "fainting"
hunger_hungry = "hungry"
hunger_not_hungry = "not hungry"
hunger_satiated = "satiated"
hunger_starving = "starving"
hunger_weak = "weak"
stat_dexterity = "dexterity"
stat_dexterity_abbrev = "Dx"
# What a corpse gives of the stat ("Something of its nimbleness passes into you.").
stat_dexterity_gift = "nimbleness"
# What a rise in the stat makes you ("You feel quicker.").
stat_dexterity_more = "quicker"
stat_intelligence = "intelligence"
stat_intelligence_abbrev = "In"
stat_intelligence_gift = "cunning"
stat_intelligence_more = "sharper"
stat_presence = "presence"
stat_presence_abbrev = "Pr"
stat_presence_gift = "bearing"
stat_presence_more = "more confident"
stat_strength = "strength"
stat_strength_abbrev = "St"
stat_strength_gift = "strength"
stat_strength_more = "stronger"
stat_toughness = "toughness"
stat_toughness_abbrev = "To"
stat_toughness_gift = "hardiness"
stat_toughness_more = "tougher"
stat_willpower = "willpower"
stat_willpower_abbrev = "Wi"
stat_willpower_gift = "resolve"
stat_willpower_more = "more resolute"

# `n`: how many hours.
[hours]
by = "n.number"
one = "{n:bare} hour"
many = "{n:bare} hours"

# `n`: how many minutes.
[minutes]
by = "n.number"
one = "{n:bare} minute"
many = "{n:bare} minutes"

# `n`: how many seconds.
[seconds]
by = "n.number"
one = "{n:bare} second"
many = "{n:bare} seconds"
