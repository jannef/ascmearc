draught_kept = "There is enough left in the flask for another draught."
drink = "You drink {what:the}."
drown = "You drown..."
# `disease`: the disease treated, whose it is said in place of the article ("the sickness", "your
# wolf's sickness").
ease_somewhat = "You ease {disease:the} somewhat."
eat = "You eat {what:the}."
eat_your_fill = "You eat your fill; the rest does you no good."
elixir_no_difference = "You feel no different."
# `feel`: the stat's comparative ("stronger").
elixir_rise = "You feel {feel:bare}."
