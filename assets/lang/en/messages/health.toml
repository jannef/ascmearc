# Health (`world/health/`): statuses, diseases, healing, hunger, eating, drinking, pipes, flasks, and
# how the player dies of hunger, choking, or drowning (`Cause::message`, `world/combat/fight.rs`).
# Ids alphabetical (`docs/dev/localization.md` "Literal lines"). What the data writes (a status's
# start and end lines, a corpse's `on_eat` message) is said by its key in the data, not here
# (`docs/dev/localization.md` "Lines of data").
#
# Roles: `who` is the one a line is about, `what` an item (a phrase built where it is said),
# `status` a status as it looks ("dazed"), `came` the clause that says what stopped a long action
# ("A kobold comes into view"), `time` how long it went on ("3 minutes"), `disease` a disease with
# whose it is. `feel`, `more`, `doing`, and `what` in `gift_passes` are core's English words, text
# until they are converted.

blink_elsewhere = "In a blink, you are elsewhere."
break_free = "You break free."
# `who`: the one holding you.
break_free_of = "You break free of {who:the}."
cannot_consume = "You cannot consume {what:a}."
cannot_smoke = "You cannot smoke that."
# `doing`: what the action is ("reading"); `status`: the status that blocks it, lower case.
cannot_while = "You cannot {doing:bare} while {status:bare}."
# A dev action's: `name` the disease's name.
carry_disease_already = "You carry {name:bare} already (dev)."
carry_no_such_thing = "You carry no such thing."
# A dev action's.
catch_disease = "You catch {name:bare} (dev)."
choke = "You choke to death on {what:the}..."
# `more`: the stat's comparative ("stronger").
could_grow_yet = "You feel you could grow {more:bare} yet."
crash_of_glass = "You hear a crash of glass."
# A drain that took from no stat.
deathly_chill = "A deathly chill passes through you."
die = "You die..."
# `stat`: the stat a drain took from, lower case ("strength"), core's word.
