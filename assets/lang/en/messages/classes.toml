# The classes (`world/classes/`): the class actives and their refusals, the ascetic's ki tricks,
# Charge, Consecrate, the classes' talents given, the mark of openings, and the business
# partner's stake; Exploit, the merchant's eye, the prayer, Sanctuary, the smites, the songs, the
# stipend, Rage, Lurk, Volley, War cry, and Cackle. Ids alphabetical (`docs/dev/localization.md`
# "Literal lines"). The lines the data writes (a talent's handed-out `news`, a resource's
# `lacking`, the prayer's words) are lines of data, said by their keys (`content/data_line.rs`).
#
# Roles: `who` is a creature a line is about, as the player calls it ("the kobold", "Grimbold");
# `keeper` a shopkeeper by name; `missile` what flew ("the arrow"); `what` a stack as the player
# knows it, a list of them, or an object type. `status` is a status by its name (`status:<id>`,
# "raging"), `name` a resource's (`resource:<id>`), `talent` a talent's
# (`talent:<id>`), and `song` a song's (`song:<id>`); `reason` is why an ability cannot be used, a
# message of its own (`messages/ability.toml`). `came` is who came and how ("The kobold comes
# close"), from `turn/rest.rs`. `id` is a class active's id as typed (dev). `gold` is a number,
# said in digits.

