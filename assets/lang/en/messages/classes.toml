# The classes (`world/classes/`): the class actives and their refusals, the ascetic's ki tricks,
# Charge, Consecrate, the calling, the classes' talents given, the mark of openings, and the
# business partner's stake. Ids alphabetical (`docs/dev/localization.md` "Literal lines"). The
# lines the data writes (a calling's `message`, a talent's handed-out `news`, a resource's
# `lacking`) are lines of data, said by their keys (`content/data_line.rs`).
#
# Roles: `who` is a creature a line is about, as the player calls it ("the kobold", "Grimbold");
# `keeper` a shopkeeper by name; `missile` what flew ("the arrow"). `status` is a status as the
# player sees it, lower case ("raging"); `talent` and `name` are a talent's and a resource's
# names from the data, and `reason` why an ability cannot be used: text until those words are
# converted. `came` is who came and how ("The kobold comes close"), from `turn/rest.rs`. `class`
# is a class id as a word (dev) and `id` a prestige class id as typed (dev). `gold` is a number,
# said in digits.

