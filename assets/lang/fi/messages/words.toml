# The fixed words core picks from a few (#1996), nested in the line or the screen entry that says
# them, so a line cannot put them in a case: each word is written in the form its lines need.
# Lower case, as in a sentence; a label asks `Bare` for its capital. Forms chosen:
# - a stat's name, a hunger, a burden, a health word, a rarity, a weather: the nominative;
# - a stat's `_more` (and `describe.stat_*`): the translative ("vahvemmaksi"), for "Tunnet itsesi
#   …", "Tekee sinut pysyvästi …", "voisit kasvaa vielä …";
# - a stat's `_gift`: the partitive ("notkeutta"), for "Sinuun siirtyy hiukan sen …";
# - a direction: by the slot it is said in (`by = "slot.form"`, #2062): `ela` "idästä" (a voice
#   or a sound heard from there), `ill` "itään", `ine` "idässä" (the way to an ally), else the
#   nominative;
# - a `doing_*`: the first infinitive, after "Et voi …".
#
# Roles: `burden` a burden's name, `weight` a weight in words; `hours` and `minutes` spans of time;
# `mark` a slot's mark; `n` a count.

