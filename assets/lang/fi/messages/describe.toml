# An item's description (`magic/describe.rs`): the describe screen's lines and the wiki's, a line
# each: what it is and its gems, its base stats, its numbers, an affix's effect (`does_*`), a
# grimoire's, a wand's, a rod's, and a potion's lines, what it can bear, its maker's mark, and
# what the Eye for the make reads of it (`make_*`).
#
# Roles: `what` is the item (a phrase, or a message of it); `n` and `v` numbers (an affix's value
# `v`, after a sign the template writes); `dice`, `critical`, `weight`, `made`, `hit`, a crystal's
# `colour` and a family's `word`, and a part's or a weapon's name (`part`, `noun`) are notation or
# text; `about` a description and `effect` a rod effect's name (text); `spell` a spell
# (`spell:<id>`); `kind` a damage type (`damage_type:<id>`, or the message `some_kind`) and
# `pool` a resource (`resource:<id>`, or the message `a_pool`): both said `bare`, in parentheses
# or as a subject, since the message takes no case; `slot` an equipment slot; `status` a status;
# `stat` a stat's name or a `stat_*` word (the translative); `skill` a skill; `bane` a creature
# tag; `affix` an affix; `does`, `speed`, `place`, `hard`, `rarity`, and `line` messages of their
# own; `kinds`, `cures`, `raised`, `against`, `from`, and `parts` lists (or a `listed`,
# `and_joined`, or `or_joined` message).
#
# Terms: Armour panssari, Deflection kimmotus, Dodge väistö, Parry asetorjunta, Shield kilpi,
# Protection suojaus, Defence torjunta.

