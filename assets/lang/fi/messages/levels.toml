# Levels (`world/levels/`): travel between levels and on the overworld, stairs and the ones who
# follow, the overworld's encounters, deep water, ice, fire, webs, the Pits, and the dev actions
# that move the player or reshape a level.
#
# Roles: `who` is the creature a line is about; `pack` the player's allies, a list; `what` a thing
# or a terrain; `fire` the burning terrain. `place` a place by its name, a word in any case
# (`lexicon/place.toml`, or `branch_level`: "Saavut {place:ill}."); `party` an encounter's party,
# a line of data said as written ("Vastaasi tulee {party:bare}.") or in the case its slot asks
# ("Lähdet {party:gen} perään.", `by = "slot.form"` in `data/encounter.toml`). `verb` is
# a damage type's verb (third person, takes a partitive object) and `seen` how a status looks.
# `error` is a refusal's reason, English for developers; `id` a level, location, or encounter id
# as typed; `x`, `y`, `cells`, `laid`, and `price` are numbers.

