# Combat (`world/combat/`); the roles as in `en/messages/combat.toml`. `actor` attacks and
# `target` is attacked (either may be the player); `weapon` what strikes, with its owner, a trap's
# possibly plural ("nuolet"); `verb` a line of data, a finite verb taking a partitive object,
# already in the actor's person. A plural trap actor gets English's plural verb, which in Finnish
# would be the second person: its lines say a verb of their own (`actor.number` `many`).

