# Crafting (`world/crafting/`): making a recipe, cutting gems, enchanting, crystals, digging, the
# field forge, mining, mending, a patron's commission, rigging traps, salvage, setting gems,
# tempering and whittling, and long work cut short. Ids in the English file's order. Roles as in
# the English file: `what`, `item`, `stone`, `title`, `gem`, `crystal`, `wall`, `station`,
# `affix`, `skill`, `recipe`, `launcher`, `giver`, `work`, `rig`, `trap`, `piece`, `colour`,
# `word`, `stock`, `family`, `first`, `rest`, `form`, and `materials` are phrases (or nested
# messages); `magic`, `time`, `came`, `leave`, `items`, `takes`, and `kinds` nested messages
# (said `bare`, in the case their own template gives: so `magic` is a subject, "Sen taika
# siirtyy kristalliin"); `shut` a list of phrases; `count` and `n` numbers; `name` text.
#
# A thing made, handed over, or broken out is a total object, counted as English counts it
# (`counted_acc`): the genitive for one ("Teet pitkämiekan") and the numeral with the partitive
# for several ("Teet kaksikymmentä nuolta"). A
# span of time (`time`) is said as an adverbial in the partitive
# ("Kaivoit kolme minuuttia").
#
# What a recipe takes (`takes_*`, `work_*`, `stock_*`, `rig_takes_*`) are noun phrases in the
# nominative, read as a list ("veitsi ja hiottu jalokivi"). Several materials said with "tai" are
# a nested message, which takes no case, so a count of stock says its materials in parentheses
# ("kolme harkkoa (rautainen tai messinkinen)").
#
# Terms: kristalli (crystal), sydänkristalli (heart-crystal), sielunkahle (soul-fetter), sinetti (seal),
# ohje (recipe), tilaustyö (commission), mesenaatti (patron), ansa (rig, trap), alasin (anvil),
# ahjo (forge), upottaa (set a gem), hioa (cut a gem), vuolla (whittle), karkaista (temper).

