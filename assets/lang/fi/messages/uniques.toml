# Unique items (`content/unique.rs`).

# A unique shield's Cast power goes off (Demonsoul, #2095).
flames_from_shield = { text = "{who:Gen} kilvestä leimahtaa liekkejä!", of = "929475" }
flames_from_your_shield = { text = "Kilvestäsi leimahtaa liekkejä!", of = "e3fd55" }
# The Parley power (#2129): a thinking creature will not fight the player.
holds_back = { text = "{who:Nom} pidättäytyy eikä käy kimppuusi.", of = "a5ee38" }
# The Spread power (#2122, Smitte): the player's hexes spread from the one they hit.
hexes_spread = { text = "Kirouksesi tarttuvat {who:Gen} lähellä oleviin!", of = "f06c92" }
# A unique sling's hail falls where its stone stopped (Hagolscūr, #2114).
hail_falls = { text = "Rakeita sataa rajusti!", of = "da3adc" }
# A spell or a scroll refused in a unique's silence (Swīge, #2112).
hushed = { text = "Tässä hiljaisuudessa ei synny sanaakaan.", of = "643f8b" }
# A Grudge's grudges (the Wrecend, #2131).
grudges = { by = "n.number", one = "Se kantaa {who:all} kaunaa yhdestä iskusta.", many = "Se kantaa {who:all} kaunaa {n:num} iskusta.", of = "0bcac4" }
# A craft refused on a unique: Temper, Whittle, setting a gem in it, taking it apart.
no_craft = { text = "Se on ainutlaatuinen: mikään taitosi ei muuta sitä.", of = "749215" }

# An Oath pays what its wielder's zeal is short in hit points (the Oath, #2117).
oath_paid = { text = "Maksat loput valastasi verelläsi.", of = "0a11e0" }
# A Tally's debt (Wergild, #2109).
owed_a_fortune = { text = "Sille ollaan velkaa omaisuus.", of = "4c2744" }
owed_a_little = { text = "Sille ollaan velkaa vähän.", of = "c9e5e3" }
owed_much = { text = "Sille ollaan velkaa paljon.", of = "1900ce" }
# The Wakes power (#2110, Beornhama's): its rage sleeps; it wakes in its wearer.
rage_sleeps = { text = "Karhu nukkuu siinä.", of = "624e87" }
rage_wakes = { text = "Karhu herää: {who:Nom} raivostuu!", of = "4fdb11" }
rage_wakes_you = { text = "Sinussa herää karhu!", of = "1f6e0a" }

# The Restore power (#2098): a death near the stone's wearer undone.
restored = { text = "{who:Nom} kaatuu ja nousee jälleen eheänä!", of = "15db52" }
restored_unseen = { text = "Sormesi kivi lämpenee.", of = "621eab" }
restored_you = { text = "Kuolema päästää sinusta irti: nouset jälleen eheänä!", of = "50e146" }

# The Roar power (#2136, Gorthak's): a kill with the weapon, and the foes who heard it.
roar = { text = "{who:Gen} iskun mukana kajahtaa mahtava huuto!", of = "3cb0ec" }
roar_quails = { text = "{who:Nom} kavahtaa ja pakenee.", of = "e64334" }
roar_stands = { text = "{who:Nom} ei hätkähdäkään.", of = "ed6dd9" }
roar_yours = { text = "Iskusi mukana kajahtaa mahtava huuto!", of = "57ebf3" }

# The Plant power (#2132): the planted player is not driven from their cell.
stand_fast = { text = "Seisot lujana paikallasi.", of = "0121fd" }

# Feet that never spring a trap (Tiptoe, Hushfoot; #2141, #2133).
tread_over_trap = { text = "Astut {trap:counted_gen} yli, eikä se laukea.", of = "a32251" }

# The Ring power (#2127, the Kettle Hat): a blow lands on the helm's wearer.
rings_helm = { text = "{who:Gen} kypärä kumahtaa kuin lyöty pata!", of = "101ada" }
rings_your_helm = { text = "Kypäräsi kumahtaa kuin lyöty pata!", of = "8dc87f" }

# The Scars power (#2137, Scarhide): a critical hit on the player scars what they wear.
scarred = { text = "Isku jättää arpensa haarniskaasi.", of = "17a6ea" }

# The Pilfer power (#2119 the Fambles, #2138 Snaffle): the player's blow takes something its
# target carries.
pilfered = { text = "Nappaat {who:abl} {what:counted_acc}.", of = "98a7cf" }
snaffled = { text = "Teräsi tuo mukanaan {what:counted_acc}!", of = "18f67e" }
plucked = { text = "Teräsi nappaa {what:acc} {who:gen} kädestä!", of = "63b22c" }

# The scars a Scars power's item bears, on its description: `n`, how many.
[scars]
of = "29a270"
by = "n.number"
one = "Siinä on {n:num} arpi."
many = "Siinä on {n:num} arpea."
