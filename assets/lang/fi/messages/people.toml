# People (`world/people/`): quests and their log, escorts, lure quests, the wizards' quarrel,
# guild ranks, shops, services, and traders' wares. Talk's own lines are `talk.toml`'s.
#
# Roles: `who` is the one a line is about (a person by what the player calls them; a shopkeeper
# by name); `what` a thing; `gold`, `owed`, `price`, `have`, `need`, `xp`, and `times` numbers,
# in digits. `skill` is a skill (`skill:<id>`). `place` (a place's name), `quest` (a quest's
# name), and `shop` (a shop's sign) are lines of data that render as written, in no case: the
# lines say them in the nominative ("paikkaan {place:bare}"). `id` and `target` in a dev action's
# line are as typed.
#
# A quest's task (`task_*`, `step_*`, `target_*`) is an imperative ("tuo miekka Hildille"), its
# object in the nominative (`counted`: "tuo kolme sudentaljaa").

# What a quest asks, as the wiki's quest table says it: `task`, a `task_*` line.
