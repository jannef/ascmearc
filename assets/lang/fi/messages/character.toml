# The character (`world/character/`): experience and levels, talents and skill rolls, stats
# trained and wasted, the birth sign's gifts and breaths, the racial actives, the ratfolk craving,
# profane gifts, the laws, and the dev actions that grant these.
#
# Roles: `who` is a creature a line is about. `status` is a status by its name (`status:<id>`),
# `skill` a skill's, and `name` a resource's; `talent` and `gift` are a talent's and a profane
# gift's names (or the nested `talent_chosen`, which reads the slot's case for the name,
# "{talent:acc}"), and `trees` and `talents` lists of them; `reason` a message of
# its own. `id` is an id a dev action was given, as typed. `xp`, `level`, and `value` are numbers.
#
# A talent's needs (`talent_needs_*`) are noun phrases, a row of the Talents page each and the
# list after `talent_unmet`'s "vaatimukset:".

# A talent's need of any of several weapon skills: `skill` (`weapon_skill:<id>`, as its label);
# two of them, `first` and `rest`; the roles it names, `roles` (`weapon_role:<role>`).
