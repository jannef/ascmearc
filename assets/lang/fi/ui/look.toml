# Look mode's line (`crates/ascmearc/src/ui/look.rs`). Nested clauses (ground, things, who) take
# no case from the entry that holds them: each picks its own here. The ground after "on" is the
# adessive (`ground`), named alone the nominative (`ground_named*`); things, traps, and creatures
# are always said in the nominative, so a sentence that holds them is built around that.

