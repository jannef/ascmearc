# Objects (`object:<id>`): Cēaptūn's shops and piles, the classes' starting kits, what the
# kobolds carry. An item made of its own parts has `material`, the base text of the material
# word its name already implies (a Finnish head names no material: "kypärä" is iron), so that
# material is left unsaid; another one is said before it ("pronssinen kypärä"). A pair of
# something (gloves, boots) is a word with no singular (`plural_only`). A corpse is its creature's
# genitive and `ruumis` (the sapient and the named) or `raato` (beasts). A scroll or a wand of a
# spell is the spell's genitive and its head ("tulipallon käärö").
