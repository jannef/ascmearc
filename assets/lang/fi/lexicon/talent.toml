# Talents (`talent:<id>`): every talent of the trees and every profane gift (a gift is a
# talent). A talent's name keeps its capital as English does, in a sentence too ("Opit
# taipumuksen Valpas.", "Saat taipumuksen: Raivo."), and is said mostly in the nominative; every
# word has its class so it inflects. A name of hands, roots, or eyes is plural (`plural_only`).
# A gift is said "Olet nyt {gift}", so most gifts are adjectives. A talent named for the spell
# it grants takes the spell's name (`lexicon/spell.toml`).
