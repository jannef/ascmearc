# Materials (`material:<id>`): an agreeing adjective before what is made of it ("rautainen"),
# its `compound` the noun a part's compound adjective is built on ("rautakärkinen"); no other
# explicit case, which would hijack the agreeing adjective's ("piikivisen sidonnan käärö"). A
# material that names a head's own stuff is an adjective of its own ("karkaistu nahkalakki").
# Gems are nouns: a loose gem is named by its material ("suuri rubiini").
