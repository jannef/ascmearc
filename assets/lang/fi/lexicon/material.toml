# Materials (`material:<id>`): an agreeing adjective before what is made of it ("rautainen"),
# its `compound` the noun a part's compound adjective is built on ("rautakärkinen"). A
# material said "of" (a block of stone, a bolt of cloth) takes its noun's genitive (`gen`).
# Gems are nouns: a loose gem is named by its material ("suuri rubiini").
