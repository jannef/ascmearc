# Statuses (`status:<id>`), said as a predicate ("Olet yhä pökertynyt"); `label` where the
# status bar's capitalized word is not the capitalized predicate. A predicate is never a `-va`
# participle, which Finnish does not say of a state ("Olet nukkuva", "on hiipuva": owner review 2):
# such a status is a locative or an idiom ("unessa", "liekeissä", "hiipumassa", "haavoilla",
# "raivon vallassa"): its noun with the three forms the templates ask spelled out (`nom`, the
# predicate and `bare`; `ill` for `died_of`, "Kuoli verenhukkaan"; `tra` for what a spell or
# potion leaves one in, "jättää kärmäläisen uneen"); the attributive word stays in
# `status_seen.toml` ("nukkuva kärmäläinen"). A spent ability's wait is
# "<the ability>sta uupunut" ("Olet yhä loikasta uupunut"), its label "<Ability> käytetty".
