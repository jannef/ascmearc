# Recipes (`recipe:<id>`): a recipe's name as the profession screen lists it, and in a sentence
# ("Hionta tehdään omasta valikostaan"). A recipe that makes an item is named by the item's
# word (`lexicon/object.toml`), a pair or a batch by its plural (`label`); one that works an item
# already made is a noun of the act ("Karkaisu"). Setting a gem and the enchanting works name no
# profession's verb, so the craft dialog says their name `bare` as its verb: their `nom` form is
# that imperative ("Sytytä pitkämiekka?") and their `label` the noun the screens list. No sentence
# says them in the nominative.

