[weapon_rack]
description = { text = "Puinen teline keihäille ja terille. Useimmat sen tapeista ovat tyhjiä.", of = "234c60" }

[web]
description = { text = "Harmaita säikeitä, paikoin köyden paksuisia, riippuu seinästä lattiaan. Ne tarttuvat kaikkeen, mikä niitä hipaisee, ja palaisivat kuin taula.", of = "168fdd" }

[window]
description = { text = "Lasiton aukko seinässä, niin leveä, että siitä voi kurkottaa ulos.", of = "911a5d" }

[workbench]
description = { text = "Raskas, työkalujen arpeuttama höyläpenkki, sen ruuvipuristimet ruostuneet kiinni.", of = "617622" }
