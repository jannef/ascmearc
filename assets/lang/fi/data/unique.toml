# Lines of data: unique items (`unique:<id>.<field>`). A unique keeps its name as the data writes
# it (a proper name, in every language); its `phrase` (what its power does, on its description)
# and `lore` are sentences of their own, its `power.message` what its wearer is told as it wards
# off a status. Old in tone, as the lore of heirlooms is.

[beornhama]
lore = { text = "Karhu ei kysy, oletko valmis.", of = "c7ad73" }
phrase = { text = "Kun sen kantaja on kuoleman partaalla, karhu siinä herää ja raivoaa hänen puolestaan, väsyneenä tai ei; sitten se nukkuu pitkään.", of = "cf2b50" }

[brosinga_mene]
lore = { text = "Hama vei sen mukanaan kirkkaaseen kaupunkiin, eikä kukaan ole sittemmin kertonut, minne se joutui.", of = "7f1af7" }
phrase = { text = "Mikään myrkky ei tartu sen kantajaan.", of = "78b2f2" }

[brosinga_mene.power]
message = { text = "Myrkky ei saa sinusta otetta.", of = "f7ef80" }

[cracked_resurrection_stone]
lore = { text = "Se hiottiin herättämään yksi kuningas kuolosta. Kolmannella herättämisellä se murtui, ja siitä asti se on herättänyt mitä tahansa.", of = "42686a" }
phrase = { text = "Mikä tahansa sen kantajan lähellä kuolee, voi nousta jälleen eheänä, niin ystävä kuin vihollinenkin.", of = "a82e77" }

[deep_night]
lore = { text = "Kudottu aamunkoittoa edeltävästä hetkestä, jolloin tähdetkin luovuttavat.", of = "f80374" }
phrase = { text = "Sen kantaja kulkee näkymättömänä ja näkee pimeässä, ja jokainen valo hänen lähellään sammuu.", of = "41888b" }

[demonsoul]
lore = { text = "Jotakin suljettiin sen sisään kauan sitten, eikä se ole sen jälkeen jäähtynyt.", of = "bc3b0c" }
phrase = { text = "Se vastaa iskuihin tulella. Sen kantaja ei pelkää liekkejä, mutta pakkanen puree häntä syvemmältä.", of = "c725ae" }

[domgeorn]
lore = { text = "Hän kantoi sitä kentälle ja toi kotiin laulun. Muut toivat kotiin haavat.", of = "2f6633" }
phrase = { text = "Jokainen kuolema, jonka sen kantaja näkee, on hänen: niin maine kuin syykin.", of = "d5ca0b" }

[eorcanstan]
lore = { text = "Kivi on tumma, kunnes sen lähellä lausutaan loitsu; silloin se tummuu entisestään.", of = "5dc3aa" }
phrase = { text = "Mikään hiljaisuus ei vaienna sen kantajan ääntä.", of = "b8013d" }

[eorcanstan.power]
message = { text = "Hiljaisuus ei saa ääntäsi vaikenemaan.", of = "3bc6d2" }

[eorthfaest]
lore = { text = "Nojaa siihen selkäsi, niin vuori on takanasi. Lähde kävelemään, niin se on pelkkää puuta ja rautaa.", of = "5ef9f3" }
phrase = { text = "Mitä kauemmin sen kantaja seisoo, sitä vaikeampi häntä on haavoittaa, eikä mikään liikuta häntä.", of = "826bf0" }

[gar]
lore = { text = "Jokaisen kilpimuurin takana on rivi näitä, ja jokaisen rivin takana rivi.", of = "1a6fc5" }
phrase = { text = "Sen pisto menee läpi: sekin, joka seisoo lyödyn takana, saa iskun, oli ystävä tai vihollinen.", of = "f0a260" }

[gorthak]
lore = { text = "Kun se iskee alas, kuuluu huuto, eikä kukaan tiedä varmasti kenen.", of = "233c45" }
phrase = { text = "Sen jokainen tappo on karjaisu: sen nähneet viholliset voivat menettää rohkeutensa ja paeta.", of = "7b132f" }

[grandmother]
lore = { text = "Hän on elänyt kauemmin kuin kolme sukua ja haudannut jokaisen pojan, joka häntä kantoi.", of = "3ccae1" }
phrase = { text = "Sen viiltämät haavat umpeutuvat hitaasti.", of = "64f657" }

[grendles_grape]
lore = { text = "Sormet puristuvat hiukan tiukemmin kuin niiden sisällä oleva käsi.", of = "f41c75" }
phrase = { text = "Mikään isku ei horjuta sen kantajaa.", of = "847eb1" }

[grendles_grape.power]
message = { text = "Pysyt jaloillasi.", of = "dada06" }

[haersceorp]
lore = { text = "Se kutittaa. Siinä koko ajatus.", of = "d5e89e" }
phrase = { text = "Jokaisen sen kantajaan osuvan iskun kipu kertyy ki-voimaksi.", of = "c086da" }

[high_toby]
lore = { text = "Moni vaunu on pysähtynyt sen tähden, ja moni kuski juossut karkuun.", of = "6c3884" }
phrase = { text = "Sen nuolet jättävät vuotavia haavoja.", of = "0f05cd" }

[hushfoot]
lore = { text = "Mummo sano: suappaat jalassa et kuule yhtikäs mittään tulovan, kultaseni.", of = "78f9b5" }
phrase = { text = "Paljain jaloin sen kantaja kulkee äänettä, väistää ketterämmin ja tuntee jokaisen ansan jalkojensa alla; yksikään ansa ei laukea hänen allaan.", of = "e013b2" }

[kettle_hat]
lore = { text = "Se piti sateen poissa ja keiton sisällä. Sitten tuli sota, ja se piti miekankin poissa.", of = "d2d11a" }
phrase = { text = "Jokainen siihen osuva isku kumahtaa kauas, ja meteli horjuttaa jokaista sen kantajan vieressä seisovaa.", of = "6e7327" }

[masterpiece]
lore = { text = "Sen tehnyt seppä laski vasaransa sen jälkeen, sillä parannettavaa ei enää ollut.", of = "98c4d7" }
phrase = { text = "Moni sen tavoittanut isku raukeaa tyhjiin.", of = "75ac3a" }

[masterpiece.power]
message = { text = "Isku raukeaa tyhjiin rengaspaitaasi vasten.", of = "5a42d8" }

[oath]
lore = { text = "Kerran vannottu. Siitä asti pidetty, maksoi mitä maksoi.", of = "038086" }
phrase = { text = "Sen kantaja voi maksaa verellään puuttuvan intonsa, ja sen iskut sytyttävät intoa kaksin verroin.", of = "1e9a8b" }
[onraes]
lore = { text = "Rivi piti. Hän ei.", of = "9806da" }
phrase = { text = "Sen kantajan rynnäkkö ei vie henkeä, kantaa minkä matkan tahansa ja ajaa vihollisen taaksepäin. Sen askel on raskas ja kuuluva.", of = "e8eb81" }

[radiant]
lore = { text = "Se taottiin pyhän lähteen äärellä, eikä se ole sen jälkeen pimennyt, vaikka moni on yrittänyt sitä sammuttaa.", of = "1f3284" }
phrase = { text = "Se luo kantajansa ympärille valon kuin keskipäivällä.", of = "db315d" }

[satisfaction]
lore = { text = "Hän ei koskaan tarvinnut kuin sen yhden.", of = "ae7b4b" }
phrase = { text = "Sen ensimmäinen kosketus vahingoittumattomaan viholliseen osuu aina syvälle.", of = "f368a7" }

[scarhide]
lore = { text = "Jokaisen siinä näkyvän arven sen ensimmäinen omistaja kantoi ensin omassa nahassaan.", of = "656178" }
phrase = { text = "Jokainen sen kantajan saama ankara haava kovettaa sitä hieman lisää.", of = "ebed52" }

[scrift]
lore = { text = "Lue rukouksesi. Sitten varmista.", of = "0e8f22" }
phrase = { text = "Jokainen sen osuva isku on suoritettu katumustyö.", of = "b43f52" }

[sigerics_star]
lore = { text = "Sormuksen sisäpuolella, hyvin pienin kirjaimin: SIGERIC MINUT TEKI. Ulkopuolella, suuremmin: SIGERIC.", of = "8aa25a" }
phrase = { text = "Mikään ei pidä sen kantajan katsetta vangittuna.", of = "e81a46" }

[sigerics_star.power]
message = { text = "Mikään ei vangitse katsettasi kauaksi aikaa.", of = "124df4" }

[silverstrike]
lore = { text = "Sen jänne, niin jousentekijät vannoivat, oli kehrätty kuun hiuksesta.", of = "87875c" }
phrase = { text = "Sen nuolet lentävät kaksi kertaa niin kauas kuin tavallisen jousen.", of = "7eb75c" }

[stick]
lore = { text = "Se oli keppi, kun he lähtivät matkaan. Kukaan ei muista, milloin se lakkasi olemasta.", of = "65158f" }
phrase = { text = "Se tuntuu käyneen painavammaksi.", of = "875914" }

[smoulder]
lore = { text = "Ei sijnä ole tulda, ia quitengin se sauhupi.", of = "d1becc" }
phrase = { text = "Sen nuolet savuavat siellä, mihin ne pysähtyvät, osuivat tai eivät: savun läpi ei näe mikään silmä, ei sinunkaan.", of = "43456b" }

[stonebiter]
lore = { text = "Lovettu sadassa louhoksen seinässä, eikä yksikään niistä antanut periksi.", of = "fa63dd" }
phrase = { text = "Sen kantaja näkee hämärässä.", of = "95fdf0" }

[swige]
lore = { text = "Sen kantajat eivät koskaan kertoneet, mitä varten se oli. He eivät kertoneet mitään.", of = "33821f" }
phrase = { text = "Sen kantajan lähellä ei loitsita eikä kääröjä lueta, ja hänen rukouksensa käyvät keveämmin.", of = "5aeb36" }

[tiptoe]
lore = { text = "Kyl laattia o iha hyvä. Katto vaa mihe sää seisot.", of = "5a94ee" }
phrase = { text = "Yksikään ansa ei laukea sen kantajan jalkojen alla, ja hän näkee jokaisen lähellään olevan ansan.", of = "fd7e71" }

[turncoat]
lore = { text = "Rykmentin värit leikattiin siitä irti kauan sitten; ompeleet näkyvät yhä.", of = "d825c0" }
phrase = { text = "Sen kantaja ei tunne pelkoa.", of = "ff336e" }

[turncoat.power]
message = { text = "Pelko ei saa sinusta otetta.", of = "345b88" }

[unhalwed_bedes]
lore = { text = "Jokainen helmi on rystyluu, eikä yksikään niistä pyhimyksen.", of = "93ec1f" }
phrase = { text = "Sen kantaja näkee pimeässä.", of = "8a8773" }

[wergild]
lore = { text = "Jokainen pisara kirjataan, ja jokainen velka maksetaan täysimääräisenä.", of = "fca7ae" }
phrase = { text = "Kun sen kantaja raivoaa, jokainen hänen saamansa haava kirjataan siihen, ja sen seuraava isku perii velan.", of = "3d823c" }

[widowmaker]
lore = { text = "Ohut kuin hattuneula, eikä koskaan aivan puhdas.", of = "a463c4" }
phrase = { text = "Sen jokainen viilto myrkyttää.", of = "1649e4" }

[wrecend]
lore = { text = "Sitä kantoi seitsemän veljestä, ja jokainen veisti siihen loven edellisen muistoksi.", of = "33acfb" }
phrase = { text = "Se muistaa jokaisen iskun, jonka sen kantaja saa, ja maksaa kunkin takaisin sille, joka löi.", of = "48e441" }

[wyrtruma]
lore = { text = "Maahan pistettynä se kasvaisi. Kukaan ei ole uskaltanut laskea sitä käsistään niin pitkäksi aikaa, että sen näkisi.", of = "aafcec" }
phrase = { text = "Sen kantajan kutsumat pedot jäävät, kunhan ne pysyvät hänen vierellään.", of = "f3f402" }
