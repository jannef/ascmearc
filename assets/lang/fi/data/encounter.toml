# Lines of data: the overworld's encounter parties (`encounter:<campaign>.<entry>.name`), said as
# written in the nominative ("Vastaasi tulee koboldijoukko.") or, where the slot asks a case
# (`by = "slot.form"`), in the genitive ("Lähdet koboldijoukon perään.") or the partitive ("Menet
# koboldijoukkoa vastaan."), which drop `joukko` and say the members ("hiisiryöstäjien perään";
# owner review 2, #2073). A party of several is a group noun or `joukko` and the partitive, so
# the verb stays singular ("Sinä ja joukko hiisiryöstäjiä huomaatte toisenne").

[ascmearc.ascdun_duergar]
name = { by = "slot.form", gen = "harmaakääpiöiden malminetsijöiden", par = "harmaakääpiöiden malminetsijöitä", else = "joukko harmaakääpiöiden malminetsijöitä", of = "b27b45" }

