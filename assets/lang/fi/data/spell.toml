# Lines of data: spells (`spell:<id>.<field>`). `description` is the item's and the grimoire's
# rules text. `cast.verb` is what the spell's blows do, the third person singular with the
# spell's noun (`lexicon/spell_noun.toml`) its subject ("Tulipallo polttaa peikkoa"); `cast.you`
# the same said of the player's own spell ("Poltat peikkoa"), the second person; both take a
# partitive object. A spell with no verb in the data says its damage type's (or "lyö"). A charm's
# `message` and `ends` follow the charmed one's name ("Peikko pitää sinua ystävänään.").

