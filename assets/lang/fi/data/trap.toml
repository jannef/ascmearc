# Lines of data: traps (`trap:<id>.<field>`). `sign` is a phrase in the nominative ("You notice
# a tripwire"); `verb` what hits from the trap does, third person singular, taking a partitive
# object. A trap's `you` is said only for a plural noun (fight.rs: a trap is never the player),
# so it is the third person plural here.

