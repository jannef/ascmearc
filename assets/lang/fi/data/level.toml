# Lines of data: hand-made levels (`level:<id>.<field>`). Old English place names stay as
# written; a place's name takes no case yet (docs/dev/localization.md "Finnish").

[ceaptun]
arrival = { text = "Cēaptūnissa on markkinapäivä, ja torilla käy kova häly.", of = "c1bfe8" }
name = { text = "Cēaptūn", of = "5d84f5" }

[ceaptun.legend.N]
name = { text = "palkkiotaulu", of = "875b05" }
note = { text = "Ilmoituksia on naulattu kolmeen kerrokseen, ja useimmat niistä ovat vuosia vanhoja.", of = "cd27a7" }

# Gimmwīc.
[gimmwic]
name = { text = "Gimmwīc", of = "3d50bf" }
arrival = { text = "Lampunvaloa ja pienten alasinten kalke: Gimmwīc, syvägnomien kaupunki.", of = "8cdb93" }

[gimmwic.hidden.skeul_hir]
name = { text = "Skeul Hir", of = "793524" }
opens = { text = "Peran koputtaa pitkää pöytää kolmesti. Taempana, luolassa josta tulit, kivi narskuu kiveä vasten, ja laatta kääntyy ylös jyrkän pimeyteen nousevan portaikon edestä: Skeul Hir.", of = "09a363" }

[gimmwic.hidden.meyn_bew]
name = { text = "Meyn Bew", of = "c80078" }
opens = { text = "Ysella laulaa yhden pitkän sävelen. Kallio hänen vierellään soi ja aukeaa kristallinvalon kehäksi.", of = "412b6c" }

# The Ascmearc, the overworld: its places' names and notes, and the locations a quest reveals.
[ascmearc]
name = { text = "Ascmearc", of = "8245b2" }

[ascmearc.legend.1]
name = { text = "Cealdhlāw", of = "d947ba" }

[ascmearc.legend.8]
name = { text = "Lytelscræf", of = "e64cbf" }

[ascmearc.legend.9]
name = { text = "Grundlēas", of = "74576e" }
note = { text = "Paljaaseen kallioon hakatut portaat vievät alas. Kulunutta tekstiä ovenpalkissa: mitkään portaat eivät vie kahdesti samaan paikkaan.", of = "5c8ed4" }

[ascmearc.legend.D]
name = { text = "Dēopgang", of = "1bab3b" }
note = { text = "Vuoren juureen hakatut pienet, siistit portaat vievät alas. Ovenpalkkiin on upotettu jalokivi, liian korkealle ulottuville.", of = "c8c50e" }

[ascmearc.legend.P]
name = { text = "Beorggeat", of = "354951" }
note = { text = "Tie, jota tulit; lumi on sulkenut sen takanasi.", of = "8a352d" }

[ascmearc.legend.T]
name = { text = "Cēaptūn", of = "5d84f5" }

[ascmearc.legend.V]
name = { text = "Holtwīc", of = "76e6fe" }

[ascmearc.legend.g]
name = { text = "Līctūn", of = "214fe4" }

[ascmearc.legend."^"]
name = { text = "Fyrbeorg", of = "063502" }

[ascmearc.hidden.aelfham]
