[package]
name = "ascmearc-cli"
description = "Headless Ascmearc developer tool: scenarios, replays, state dumps. Does not link Bevy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
serde_json.workspace = true
ascmearc-assets.workspace = true
ascmearc-core.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The tests read the test world: a dev-dependency's features reach only the builds that compile
# the tests (docs/dev/campaign.md, "The test world in release builds").
ascmearc-assets = { workspace = true, features = ["showcase"] }

[features]
# The test world (`assets/campaigns/showcase/`), embedded only with this feature: off by default,
# so a plain build is a release build; `cargo dev-cli` and the tests turn it on
# (docs/dev/campaign.md, "The test world in release builds").
default = []
showcase = ["ascmearc-assets/showcase"]

[lints]
workspace = true
