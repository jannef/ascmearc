[features]
# The built-in content is read only in its packed form (`content/de.rs`): the TOML reader is
# compiled out, so no `toml` deserializer is built for a content type. For the web build, through
# `ascmearc-assets/packed` (docs/dev/content.md, "Packed content").
packed = []

