[package]
name = "ascmearc"
description = "Ascmearc: GPU-rendered ASCII roguelike (Bevy app: rendering, input, UI, effects)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bevy.workspace = true
clap.workspace = true
fontdue.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true
ascmearc-assets.workspace = true
ascmearc-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }
directories.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2"
# Only what browser storage and the page-hide hook need (see `storage.rs`), and the keymap's
# download and file picker (`settings/keymap.rs`: Blob to File).
web-sys = { version = "0.3", default-features = false, features = [
  "Window", "Document", "Storage", "Event", "EventTarget", "Location",
  "Blob", "BlobPropertyBag", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlElement",
  "HtmlInputElement", "Url",
] }

[dev-dependencies]
flate2.workspace = true
insta.workspace = true

[features]
# The test world (`assets/campaigns/showcase/`), embedded only with this feature: on for every
# dev command, test, and benchmark; release builds and `cargo xtask web` turn it off with
# `--no-default-features` (docs/dev/campaign.md, "The test world in release builds").
default = ["showcase"]
showcase = ["ascmearc-assets/showcase"]
# The built-in content embedded packed instead of as TOML, the TOML content reader left out: on in
# `cargo xtask web` for the wasm's size; such a build reads no `--content-dir` (docs/dev/content.md,
# "Packed content").
packed = ["ascmearc-assets/packed"]
# Embeds JuliaMono cut down at build time to the characters the game uses in place of the whole
# font: about 3.1 MB less. `cargo xtask web` turns it on (docs/dev/rendering.md, "The font").
font-subset = ["ascmearc-assets/font-subset"]

[lints]
workspace = true
