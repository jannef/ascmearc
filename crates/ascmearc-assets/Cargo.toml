[package]
name = "ascmearc-assets"
description = "The content under assets/ embedded for the binaries, handed to ascmearc-core as ContentFiles (#1587)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ascmearc-core.workspace = true

[build-dependencies]
# Only to pack the content (the `packed` feature); a build without it compiles none.
toml = { workspace = true, optional = true }

[features]
# The test world (`assets/campaigns/showcase/`), embedded only with this feature: on for every
# dev command, test, and benchmark; release builds and `cargo xtask web` turn it off with
# `--no-default-features` in the binaries that forward it (docs/dev/campaign.md, "The test world
# in release builds").
default = ["showcase"]
showcase = []
# The content embedded packed: parsed by `build.rs` into the compact form of
# `ascmearc-core/src/content/pack.rs` in place of its TOML text, and the core's TOML reader compiled
# out (the web build, for its size; docs/dev/content.md, "Packed content"). Such a build loads no
# TOML content: not `--content-dir`, not a mod.
packed = ["ascmearc-core/packed", "dep:toml"]

[lints]
workspace = true
