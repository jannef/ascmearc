[package]
name = "ascmearc-assets"
description = "The content under assets/ embedded for the binaries, handed to ascmearc-core as ContentFiles (#1587)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ascmearc-core.workspace = true

# The font subsetter, built and run only with `font-subset` (`font_subset.rs`).
[build-dependencies]
read-fonts = { workspace = true, optional = true }
skera = { workspace = true, optional = true }

[features]
# The test world (`assets/campaigns/showcase/`), embedded only with this feature: off by default,
# so a plain build is a release build; the binaries forward it, and their tests and xtask turn it
# on (docs/dev/campaign.md, "The test world in release builds").
default = []
showcase = []
# `FONT` is JuliaMono cut down at build time to the characters the game uses (about 170 kB in
# place of 3.3 MB); the web build turns it on through the game's own `font-subset` feature
# (docs/dev/rendering.md, "The font").
font-subset = ["dep:read-fonts", "dep:skera"]

[lints]
workspace = true
